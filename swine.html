<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AIRSOFT MAPS — SWINE</title>

  <link rel="stylesheet" href="common.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /*
      SWINE — první geometrický draft.
      MapEngine zatím pracuje s rect + rotate, proto je hlavní objekt
      rozdělený na 7 přesně sousedících sektorů. Jakmile odsouhlasíme
      základní proporce, můžeme přejít na skutečné polygonové hrany.
    */

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg, #0b0d0f);
    }

    .am-page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .am-map-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    .am-map-canvas {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .am-map-canvas svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      user-select: none;
      opacity: 0;
    }

    .am-map-canvas svg.am-ready {
      opacity: 1;
    }

    .am-map-title {
      position: absolute;
      left: 18px;
      top: 16px;
      z-index: 10;
      pointer-events: none;
    }

    .am-map-title strong {
      display: block;
      font-family: Anton, sans-serif;
      font-size: 28px;
      letter-spacing: .04em;
      color: var(--map-text, #eef1f0);
    }

    .am-map-title span {
      display: block;
      margin-top: 2px;
      font: 600 12px/1 Rajdhani, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--map-text, #eef1f0);
      opacity: .58;
    }

    .swine-legend {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 10;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 8px;
      background: rgba(8,10,12,.78);
      backdrop-filter: blur(8px);
      color: var(--map-text, #eef1f0);
      font: 600 12px/1.5 Rajdhani, sans-serif;
      pointer-events: none;
    }

    .swine-legend div {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .swine-legend i {
      width: 18px;
      height: 3px;
      display: inline-block;
      border-radius: 99px;
    }

    .swine-legend .red { background: #ff2a2a; }
    .swine-legend .green { background: #00e638; }
    .swine-legend .orange { background: #ff7a1a; }

    .am-map-controls {
      z-index: 20;
    }
  </style>
</head>

<body>
  <div class="am-page">

    <div class="am-map-wrap">

      <div class="am-map-title">
        <strong>SWINE</strong>
        <span>Airsoft Maps</span>
      </div>

      <div class="swine-legend">
        <div><i class="red"></i> hranice hřiště</div>
        <div><i class="green"></i> cesta</div>
        <div><i class="orange"></i> vstup</div>
      </div>

      <div class="am-map-canvas">
        <svg id="map"></svg>
      </div>

    </div>

  </div>

  <script src="common.js"></script>
  <script src="map-engine.js"></script>

  <script>
    /*
      ======================================================================
      SWINE — DATA
      ======================================================================

      GPS ANCHORY Z PŮVODNÍHO NÁKRESU

      TL  50.1709378188841,  14.022212743518688
      BL  50.170058218849704, 14.022856473678806
      BR  50.171326074686526, 14.023535072557621
      TR  50.17132075268947,  14.02353285885949

      Poznámka:
      Současný MapEngine ještě neumí polygonovou geometrii.
      Tento první draft proto používá lokální pravoúhlou geometrii,
      která nám dovolí zkontrolovat orientaci, pořadí objektů,
      proporce a ovládání. V další fázi se rect nahradí polygonem.
    */

    const SWINE_ANCHORS = {
      topLeft:     [50.1709378188841, 14.022212743518688],
      bottomLeft:  [50.170058218849704, 14.022856473678806],
      bottomRight: [50.171326074686526, 14.023535072557621],
      topRight:    [50.17132075268947, 14.02353285885949]
    };

    /*
      Lokální souřadnice:
      - hlavní objekt je dlouhý ve směru C
      - 1–5 jsou spodní část
      - 6–7 jsou horní část
      - rampa je na pomezí PRASÉČÁKY / 5
      - jednotka gridu je pouze pracovní, ne finální metr
    */

    const SWINE_DATA = {

      viewBoxFlat: "0 0 1500 1100",

      boundary: [
        [1.0, 1.2],
        [11.9, 0.0],
        [14.0, 8.0],
        [12.0, 12.7],
        [2.8, 13.7],
        [0.0, 7.0],
        [0.0, 5.9],
        [0.9, 5.6]
      ],

      roads: [
        {
          points: [
            [0.55, 5.8],
            [2.2, 5.25],
            [5.0, 4.35],
            [8.0, 3.35],
            [10.8, 2.45],
            [11.65, 3.15],
            [12.65, 7.9],
            [12.0, 10.25],
            [8.8, 11.3],
            [5.5, 12.15],
            [2.6, 11.25],
            [1.1, 7.15]
          ]
        }
      ],

      /*
        Vnější hlavní objekt.
        Jeho 7 dílů sdílí stejné vnější hrany.
        Vizuálně tak tvoří jeden celek.
      */
      buildings: [

        {
          id: "swine-6",
          code: "6",
          name: "6",
          nameEn: "6",
          rect: [3.25, 3.65, 4.65, 7.15],
          rotate: -14,
          height: 0.9
        },

        {
          id: "swine-7",
          code: "7",
          name: "7",
          nameEn: "7",
          rect: [4.65, 3.65, 6.45, 7.15],
          rotate: -14,
          height: 0.9
        },

        {
          id: "swine-1",
          code: "1",
          name: "1",
          nameEn: "1",
          rect: [3.25, 7.15, 4.65, 11.45],
          rotate: -14,
          height: 0.9
        },

        {
          id: "swine-2",
          code: "2",
          name: "2",
          nameEn: "2",
          rect: [4.65, 7.15, 6.15, 11.45],
          rotate: -14,
          height: 0.9
        },

        {
          id: "swine-3",
          code: "3",
          name: "3",
          nameEn: "3",
          rect: [6.15, 7.15, 7.65, 11.45],
          rotate: -14,
          height: 0.9
        },

        {
          id: "swine-4",
          code: "4",
          name: "4",
          nameEn: "4",
          rect: [7.65, 7.15, 9.15, 11.45],
          rotate: -14,
          height: 0.9
        },

        {
          id: "swine-5",
          code: "5",
          name: "5",
          nameEn: "5",
          rect: [9.15, 7.15, 10.55, 11.45],
          rotate: -14,
          height: 0.9
        },

        /*
          RAMPA — záměrně samostatný objekt na pomezí PRASÉČÁKŮ / 5.
        */
        {
          id: "rampa",
          code: "RAMPA",
          name: "Rampa",
          nameEn: "Ramp",
          rect: [9.15, 6.0, 10.05, 7.25],
          rotate: -14,
          height: 0.45
        },

        {
          id: "registrace",
          code: "REGISTRACE",
          name: "Registrace",
          nameEn: "Registration",
          rect: [1.65, 7.15, 2.55, 9.95],
          rotate: -14,
          height: 0.65
        },

        {
          id: "pitevna",
          code: "PITEVNA",
          name: "Pitevna",
          nameEn: "Dissection room",
          rect: [1.75, 2.0, 3.1, 3.05],
          rotate: -14,
          height: 0.65
        },

        {
          id: "samotka",
          code: "SAMOTKA",
          name: "Samotka",
          nameEn: "Solitary",
          rect: [4.0, 1.55, 7.2, 2.55],
          rotate: -14,
          height: 0.65
        },

        {
          id: "garaze",
          code: "GARÁŽE",
          name: "Garáže",
          nameEn: "Garages",
          rect: [5.2, 11.5, 6.15, 13.0],
          rotate: -14,
          height: 0.65
        },

        {
          id: "vodarna",
          code: "VODÁRNA",
          name: "Vodárna",
          nameEn: "Water plant",
          rect: [10.8, 10.45, 11.75, 12.0],
          rotate: -14,
          height: 0.65
        }
      ],

      walls: [],

      entrance: {
        col: 0.55,
        row: 5.8,
        angle: 75
      },

      trees: []
    };

    /*
      Minimální napojení na současný MapEngine.
      common.js může na konkrétních stránkách poskytovat jazykový systém,
      proto zde máme bezpečný fallback.
    */

    const langGetter =
      () => document.documentElement.lang === "en" ? "en" : "cs";

    const listEl = document.createElement("div");
    listEl.style.display = "none";

    const btn2d = document.createElement("button");
    const btn3d = document.createElement("button");

    btn2d.type = "button";
    btn3d.type = "button";

    const engine = MapEngine.init({
      svg: document.getElementById("map"),
      data: SWINE_DATA,
      listEl,
      getLang: langGetter,
      mountModeToggle: {
        btn2d,
        btn3d
      }
    });

    /*
      SWINE je záměrně spuštěné jako 2D mapa.
      3D tlačítko je připravené pro současný engine.
    */
    btn2d.classList.add("active");
    document.documentElement.lang = "cs";
  </script>
</body>
</html>
