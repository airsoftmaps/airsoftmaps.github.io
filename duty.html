<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRSOFT MAPS — Duty Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>

<header class="am-header">
  <a class="am-brand" href="menu.html">
    <img class="am-brand-logo" src="loga/tmavekulate.png" alt="Airsoft Maps">
  </a>

  <div class="am-field-title">DUTY ARENA</div>

  <div class="am-controls">
    <button class="am-btn" id="back-btn">← <span id="back-label">Zpět na hřiště</span></button>
    <div class="am-dd" id="lang-dd">
      <button class="am-btn">🌐 <span id="lang-current">CZ</span></button>
      <div class="am-dd-menu">
        <button data-lang="cs">Čeština</button>
        <button data-lang="en">English</button>
      </div>
    </div>
  </div>
</header>

<div class="am-map-toolbar">
  <div class="am-toggle">
    <button id="btn-2d" class="active">2D</button>
    <button id="btn-3d">3D</button>
    <button class="am-locate-btn" id="floor-btn" style="margin-left:10px;">
      <span class="dot"></span><span id="floor-label">1. patro</span>
    </button>
  </div>
</div>

<div class="am-map-body">
  <div class="am-map-canvas">
    <svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="am-sidebar">
    <div class="am-sidebar-title" id="sidebar-title">Místa na hřišti</div>
    <div id="poi-list"></div>
  </div>
</div>

<script src="common.js?v=3"></script>
<script src="geo.js?v=3"></script>
<script src="map-engine.js?v=6"></script>
<script>
  const FIELD_DATA_FLOOR1 = {
    viewBoxFlat: "0 0 1000 1500",
    boundary: [],
    entrance: null,
    roads: [],
    trees: [],

    zones: [
      { color:"#32a852", label:"SAFE ZONE", labelEn:"SAFE ZONE", rect:[110, 1010, 200, 1290] },
      { color:"#a88932", label:"A", labelEn:"A", rect:[560, 460, 700, 600] },
      { color:"#a88932", label:"B", labelEn:"B", rect:[310, 560, 450, 700] },
      { color:"#a88932", label:"C", labelEn:"C", rect:[360, 910, 450, 1050] },
      { color:"#a88932", label:"WC", labelEn:"WC", rect:[560, 1310, 750, 1390] },
      { color:"#ff0000", label:"Nehratelné", labelEn:"Unplayable", rect:[310, 210, 450, 350] },
      { color:"#ff0000", label:"Nehratelné", labelEn:"Unplayable", rect:[560, 850, 750, 1150] },
      { color:"#ff0000", label:"Nehratelné", labelEn:"Unplayable", rect:[560, 1160, 650, 1250] },
      { color:"#ff0000", label:"Nehratelné", labelEn:"Unplayable", rect:[760, 1310, 790, 1390] }
    ],

    stairs: [
      { id:"s1", toFloor:"floor2", label:"Schody", labelEn:"Stairs", rect:[400, 800, 450, 900] },
      { id:"s2", toFloor:"floor2", label:"Schody", labelEn:"Stairs", rect:[250, 1000, 350, 1050] },
      { id:"s3", toFloor:"floor2", label:"Schody", labelEn:"Stairs", rect:[450, 1050, 550, 1100] },
      { id:"s4", toFloor:"floor2", label:"Schody", labelEn:"Stairs", rect:[550, 1250, 650, 1300] },
      { id:"s5", toFloor:"floor2", label:"Schody", labelEn:"Stairs", rect:[700, 1150, 800, 1200] }
    ],

    walls: [
      { rect: [200, 200, 800, 210] },
      { rect: [200, 1390, 800, 1400] },
      { rect: [200, 200, 210, 1000] },
      { rect: [100, 1000, 200, 1010] },
      { rect: [100, 1000, 110, 1300] },
      { rect: [100, 1290, 200, 1300] },
      { rect: [200, 1300, 210, 1400] },
      { rect: [790, 200, 800, 1400] },
      { rect: [300, 200, 310, 700] },
      { rect: [450, 200, 460, 700] },
      { rect: [550, 200, 560, 700] },
      { rect: [300, 350, 450, 360] },
      { rect: [300, 450, 450, 460] },
      { rect: [300, 550, 450, 560] },
      { rect: [550, 350, 700, 360] },
      { rect: [550, 450, 700, 460] },
      { rect: [550, 600, 700, 610] },
      { rect: [550, 700, 700, 710] },
      { rect: [200, 700, 300, 710] },
      { rect: [450, 700, 550, 710] },
      { rect: [300, 800, 350, 810] },
      { rect: [450, 800, 550, 810] },
      { rect: [350, 900, 450, 910] },
      { rect: [350, 1050, 450, 1060] },
      { rect: [350, 900, 360, 1100] },
      { rect: [450, 900, 460, 1100] },
      { rect: [200, 1300, 450, 1310] },
      { rect: [550, 1300, 750, 1310] },
      { rect: [550, 1150, 750, 1160] },
      { rect: [550, 1150, 560, 1400] },
      { rect: [650, 1150, 660, 1400] },
      { rect: [750, 1300, 760, 1400] },
      { rect: [750, 900, 760, 1100] }
    ],
    buildings: []
  };

  const FIELD_DATA_FLOOR2 = {
    viewBoxFlat: "0 0 1000 1500",
    boundary: [],
    entrance: null,
    roads: [],
    trees: [],

    zones: [
      { color:"#a88932", label:"BALKÓN", labelEn:"BALCONY", rect:[360, 810, 450, 1090] },
      { color:"#a88932", label:"WC", labelEn:"WC", rect:[560, 1310, 750, 1390] }
    ],

    stairs: [
      { id:"s1", toFloor:"floor1", label:"Schody", labelEn:"Stairs", rect:[400, 800, 450, 900], heightOffset: 0.82 },
      { id:"s2", toFloor:"floor1", label:"Schody", labelEn:"Stairs", rect:[250, 1000, 350, 1050], heightOffset: 0.82 },
      { id:"s3", toFloor:"floor1", label:"Schody", labelEn:"Stairs", rect:[450, 1050, 550, 1100], heightOffset: 0.82 },
      { id:"s4", toFloor:"floor1", label:"Schody", labelEn:"Stairs", rect:[550, 1250, 650, 1300], heightOffset: 0.82 },
      { id:"s4b", toFloor:"floor1", label:"Schody", labelEn:"Stairs", rect:[650, 1250, 750, 1300], heightOffset: 0.82 },
      { id:"s5", toFloor:"floor1", label:"Schody", labelEn:"Stairs", rect:[700, 1150, 800, 1200], heightOffset: 0.82 }
    ],

    walls: [
      { rect: [350, 800, 360, 1100] },
      { rect: [450, 800, 460, 1100] },
      { rect: [350, 800, 450, 810] },
      { rect: [350, 1100, 450, 1110] },
      { rect: [450, 1050, 550, 1060] },
      { rect: [550, 1050, 560, 1300] },
      { rect: [550, 1150, 750, 1160] },
      { rect: [750, 1150, 760, 1400] },
      { rect: [550, 1300, 800, 1310] },
      { rect: [550, 1400, 800, 1410] },
      { rect: [550, 1300, 560, 1400] },
      { rect: [790, 1250, 800, 1400] },
      { rect: [750, 1250, 800, 1260] },
      { rect: [650, 1300, 660, 1400] }
    ],
    buildings: []
  };

  const svg = document.getElementById("map-svg");
  const listEl = document.getElementById("poi-list");

  const LABELS = {
    cs: { back:"Zpět na hřiště", sidebar:"Místa na hřišti", floor1:"1. patro", floor2:"Přízemí" },
    en: { back:"Back to fields", sidebar:"Points of interest", floor1:"1st floor", floor2:"Ground floor" }
  };

  let currentFloor = "floor1";

  function applyStaticText(lang) {
    document.getElementById("back-label").textContent = LABELS[lang].back;
    document.getElementById("sidebar-title").textContent = LABELS[lang].sidebar;
    updateFloorLabel(lang);
  }

  function updateFloorLabel(lang) {
    const t = LABELS[lang];
    document.getElementById("floor-label").textContent =
      currentFloor === "floor1" ? t.floor1 : t.floor2;
  }

  AM.wireDropdowns();
  applyStaticText(AM.getLang());

  document.getElementById("back-btn").addEventListener("click", () => {
    window.location.href = "menu.html";
  });

  function getFloorData(floor) {
    return floor === "floor1" ? FIELD_DATA_FLOOR1 : FIELD_DATA_FLOOR2;
  }

  function switchFloor(floor) {
    currentFloor = floor;
    engine.setData(getFloorData(floor));
    updateFloorLabel(AM.getLang());
  }

  const engine = MapEngine.init({
    svg,
    listEl,
    data: getFloorData(currentFloor),
    getLang: AM.getLang,
    onStairsClick: (toFloor) => {
      switchFloor(toFloor);
    },
    mountModeToggle: {
      btn2d: document.getElementById("btn-2d"),
      btn3d: document.getElementById("btn-3d")
    }
  });

  AM.wireLangSwitch((lang) => {
    applyStaticText(lang);
    engine.redraw();
  });

  document.getElementById("floor-btn").addEventListener("click", () => {
    switchFloor(currentFloor === "floor1" ? "floor2" : "floor1");
  });
</script>
</body>
</html>
