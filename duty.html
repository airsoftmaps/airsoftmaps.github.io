<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRSOFT MAPS — Duty Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>

<header class="am-header">
  <a class="am-brand" href="menu.html">
    <img class="am-brand-logo" src="loga/tmavekulate.png" alt="Airsoft Maps">
  </a>

  <div class="am-field-title">DUTY ARENA</div>

  <div class="am-controls">
    <button class="am-btn" id="back-btn">← <span id="back-label">Zpět na hřiště</span></button>
    <div class="am-dd" id="lang-dd">
      <button class="am-btn">🌐 <span id="lang-current">CZ</span></button>
      <div class="am-dd-menu">
        <button data-lang="cs">Čeština</button>
        <button data-lang="en">English</button>
      </div>
    </div>
  </div>
</header>

<div class="am-map-toolbar">
  <div class="am-toggle">
    <button id="btn-2d" class="active">2D</button>
    <button id="btn-3d">3D</button>
    <button class="am-locate-btn" id="floor-btn" style="margin-left:10px;">
      <span class="dot"></span><span id="floor-label">Přízemí</span>
    </button>
  </div>
</div>

<div class="am-map-body">
  <div class="am-map-canvas">
    <svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="am-sidebar">
    <div class="am-sidebar-title" id="sidebar-title">Místa na hřišti</div>
    <div id="poi-list"></div>
  </div>
</div>

<script src="common.js?v=3"></script>
<script src="geo.js?v=3"></script>
<script src="map-engine.js?v=6"></script>
<script>
  /* ====================================================================

     Souřadnice namapované dle mřížky dutygrid.png
     ==================================================================== */

      { color:"#32a852", label:"WC", labelEn:"WC", rect:[2.4, 12.5, 5.7, 13.5] },
      
      // Nehratelné místnosti (Červené)

    ],

      { id:"stairs3", toFloor:"floor2", label:"Schody", labelEn:"Stairs", rect:[3.8, 9.6, 4.8, 10.4] },
      { id:"stairs4", toFloor:"floor2", label:"Schody", labelEn:"Stairs", rect:[3.9, 10.5, 4.8, 11.4] },
      { id:"stairs5", toFloor:"floor2", label:"Schody", labelEn:"Stairs", rect:[5.0, 11.6, 6.1, 12.4] }
    ],

    walls: [

      { rect: [4.85, 3.2, 4.95, 6.5] },
      { rect: [4.85, 9.0, 4.95, 11.5] },
      { rect: [4.85, 11.5, 4.95, 13.5] },

      // Vnitřní vodorovné zdi
      { rect: [2.4, 1.95, 3.7, 2.05] },
      { rect: [4.9, 1.95, 6.2, 2.05] },
      { rect: [2.4, 3.15, 3.7, 3.25] },
      { rect: [4.9, 3.15, 6.2, 3.25] },
      { rect: [2.4, 4.15, 3.4, 4.25] },
      { rect: [2.4, 5.45, 3.7, 5.55] },
      { rect: [4.9, 6.45, 6.2, 6.55] },
      { rect: [3.7, 7.45, 4.9, 7.55] },
      { rect: [3.7, 9.45, 4.9, 9.55] },
      { rect: [4.9, 8.95, 6.2, 9.05] },
      { rect: [4.9, 11.45, 6.2, 11.55] },
      { rect: [2.4, 12.45, 6.2, 12.55] },
      { rect: [5.65, 12.5, 5.75, 13.5] }
    ],

    buildings: []
  };

  const FIELD_DATA_FLOOR2 = {
    viewBoxFlat: "0 0 500 900",

    boundary: [],
    entrance: null,
    roads: [],
    trees: [],

    zones: [
      { color:"#a88932", label:"BALKÓN", labelEn:"BALCONY", rect:[3.7, 7.5, 4.9, 10.5] },
      { color:"#32a852", label:"WC", labelEn:"WC", rect:[3.9, 12.5, 6.2, 13.5] }
    ],

    stairs: [
      { id:"stairs1", toFloor:"floor1", label:"Schody", labelEn:"Stairs", rect:[3.8, 6.5, 4.8, 7.4], heightOffset: 0.82 },
      { id:"stairs2", toFloor:"floor1", label:"Schody", labelEn:"Stairs", rect:[2.5, 8.5, 3.6, 9.4], heightOffset: 0.82 },
      { id:"stairs3", toFloor:"floor1", label:"Schody", labelEn:"Stairs", rect:[3.8, 9.6, 4.8, 10.4], heightOffset: 0.82 },
      { id:"stairs4", toFloor:"floor1", label:"Schody", labelEn:"Stairs", rect:[3.9, 10.5, 4.8, 11.4], heightOffset: 0.82 },
      { id:"stairs5", toFloor:"floor1", label:"Schody", labelEn:"Stairs", rect:[5.0, 11.6, 6.1, 12.4], heightOffset: 0.82 }
    ],

    walls: [
      // Zdi Balkónu
      { rect: [3.65, 7.5, 3.75, 11.5] },
      { rect: [4.85, 7.5, 4.95, 11.5] },
      { rect: [3.7, 7.45, 4.9, 7.55] },
      { rect: [3.7, 11.45, 4.9, 11.55] },

      // Zdi schodišťových chodbiček a WC v 1. patře
      { rect: [2.4, 8.45, 3.7, 8.55] },
      { rect: [2.4, 9.45, 3.7, 9.55] },
      { rect: [2.35, 8.5, 2.45, 9.5] },
      { rect: [4.85, 11.5, 4.95, 13.5] },
      { rect: [6.15, 11.5, 6.25, 13.5] },
      { rect: [3.7, 12.45, 6.2, 12.55] },
      { rect: [3.7, 13.45, 6.2, 13.55] }
    ],

    buildings: []
  };

  const svg = document.getElementById("map-svg");
  const listEl = document.getElementById("poi-list");

  const LABELS = {
    cs: { back:"Zpět na hřiště", sidebar:"Místa na hřišti", floor1:"Přízemí", floor2:"1. patro" },
    en: { back:"Back to fields", sidebar:"Points of interest", floor1:"Ground floor", floor2:"1st floor" }
  };

  let currentFloor = "floor1";

  function applyStaticText(lang) {
    document.getElementById("back-label").textContent = LABELS[lang].back;
    document.getElementById("sidebar-title").textContent = LABELS[lang].sidebar;
    updateFloorLabel(lang);
  }

  function updateFloorLabel(lang) {
    const t = LABELS[lang];
    document.getElementById("floor-label").textContent =
      currentFloor === "floor1" ? t.floor1 : t.floor2;
  }

  AM.wireDropdowns();
  applyStaticText(AM.getLang());

  document.getElementById("back-btn").addEventListener("click", () => {
    window.location.href = "menu.html";
  });

  function getFloorData(floor) {
    return floor === "floor1" ? FIELD_DATA_FLOOR1 : FIELD_DATA_FLOOR2;
  }

  function switchFloor(floor) {
    currentFloor = floor;
    engine.setData(getFloorData(floor));
    updateFloorLabel(AM.getLang());
  }

  const engine = MapEngine.init({
    svg,
    listEl,
    data: getFloorData(currentFloor),
    getLang: AM.getLang,
    onStairsClick: (toFloor) => {
      switchFloor(toFloor);
    },
    mountModeToggle: {
      btn2d: document.getElementById("btn-2d"),
      btn3d: document.getElementById("btn-3d")
    }
  });

  AM.wireLangSwitch((lang) => {
    applyStaticText(lang);
    engine.redraw();
  });

  document.getElementById("floor-btn").addEventListener("click", () => {
    switchFloor(currentFloor === "floor1" ? "floor2" : "floor1");
  });
</script>

</body>
</html>
