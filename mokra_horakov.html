<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRSOFT MAPS — Mokrá Horákov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>

<header class="am-header">
  <a class="am-brand" href="menu.html">
    <img class="am-brand-logo" src="logos/logoam.png" alt="Airsoft Maps">
  </a>

  <div class="am-field-title">AIRSOFT PARK — <span>MOKRÁ HORÁKOV</span></div>

  <div class="am-controls">
    <button class="am-btn" id="back-btn">← <span id="back-label">Zpět na hřiště</span></button>
    <div class="am-dd" id="lang-dd">
      <button class="am-btn">🌐 <span id="lang-current">CZ</span></button>
      <div class="am-dd-menu">
        <button data-lang="cs">Čeština</button>
        <button data-lang="en">English</button>
      </div>
    </div>
  </div>
</header>

<div class="am-map-toolbar">
  <div class="am-toggle">
    <button id="btn-2d" class="active">2D</button>
    <button id="btn-3d">3D</button>
    <button class="am-locate-btn" id="locate-btn" style="margin-left:10px;">
      <span class="dot"></span><span id="locate-label">Moje poloha</span>
    </button>
  </div>
</div>
<div class="am-locate-status" id="locate-status"></div>

<div class="am-map-body">
  <div class="am-map-canvas">
    <svg id="map-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div class="am-sidebar">
    <div class="am-sidebar-title" id="sidebar-title">Místa na hřišti</div>
    <div id="poi-list"></div>
  </div>
</div>

<script src="common.js?v=3"></script>
<script src="geo.js?v=3"></script>
<script src="map-engine.js?v=4"></script>
<script>
  /* ====================================================================
     FIELD DATA — MOKRÁ HORÁKOV
     ==================================================================== */

  const FIELD_DATA = {
    /*
       Hřiště Mokrá Horákov je ve skutečnosti orientované
       na výšku (úzké a dlouhé), ne na šířku — proto tu
       sloupce (col) mají menší rozsah než řádky (row).
       Viz podkladová fotka Pracovni_mapa_BUNKR_Strana_START.
    */
    viewBoxFlat: "0 0 950 1480",

    // GPS kotvy — reálné souřadnice zůstávají, jen přepočítané
    // na nové (výškové) rozložení sloupec/řádek.
    geoAnchors: [
      { col: 5.0, row: 1.1, lat: 49.207288, lng: 16.726320 }, // Centrála (Start)
      { col: 1.9, row: 6.0, lat: 49.206187, lng: 16.725247 }, // Z. Střelnice (vlevo)
      { col: 7.7, row: 7.6, lat: 49.205853, lng: 16.727433 }  // Z. Solár (vpravo dole)
    ],

    boundary: [
      [1.0, 1.9], [3.0, 0.6], [6.6, 0.6], [8.0, 1.9],
      [8.6, 3.4], [8.2, 4.6], [8.9, 5.8],
      [8.4, 7.0], [8.9, 8.2], [8.0, 9.4],
      [6.8, 10.6], [6.2, 12.0],
      [4.6, 12.8], [3.4, 12.0],
      [2.6, 10.6], [1.8, 9.4],
      [2.4, 8.0], [1.4, 6.6],
      [2.0, 5.2], [1.2, 3.8],
      [1.6, 2.6], [1.0, 1.9]
    ],

    entrance: { col: 4.7, row: 1.9, angle: 90 },

    roads: [
      { points: [[4.7,2.0],[4.6,3.0],[4.9,4.0],[4.3,5.0],[4.6,6.0],[4.0,7.0],[4.6,8.0],[4.9,9.0],[4.5,10.0],[4.8,11.0],[4.4,12.0]] },
      { points: [[4.3,5.0],[3.0,5.6],[1.9,6.0]] },
      { points: [[4.0,7.0],[5.8,7.4],[7.4,7.6]] }
    ],

    trees: [
      [0.6,1.0],[0.8,2.4],[0.5,3.6],[0.9,4.8],[0.6,6.0],[1.0,7.2],
      [0.7,8.4],[1.1,9.6],[1.5,11.0],[2.2,12.4],
      [9.0,2.0],[9.3,3.2],[9.0,4.4],[9.3,5.6],[9.0,6.8],[9.3,8.0],
      [9.0,9.2],[8.6,10.4],[7.6,11.6],
      [2.0,0.4],[4.0,0.2],[6.0,0.2],[7.6,0.6]
    ],

    buildings: [
      // Sever (Start & Střelnice)
      { id:"c",   code:"CENT", name:"Centrála (Start)",        nameEn:"HQ (Start)",          rect:[3.6, 0.4, 6.4, 1.8], height:0.8 },
      { id:"os",  code:"OSTR", name:"Ostré střelnice",        nameEn:"Firing Range",        rect:[0.3, 0.3, 2.4, 1.8], height:0.4 },

      // Horní pásmo
      { id:"g",   code:"GAR",  name:"Garáže",                 nameEn:"Garages",             rect:[3.6, 2.4, 4.6, 3.0], height:0.5 },
      { id:"b",   code:"BAR",  name:"Barák",                  nameEn:"House",               rect:[4.9, 3.6, 5.7, 4.3], height:1.0 },
      { id:"bsol",code:"B-SOL",name:"Bunkr Solár",            nameEn:"Solar Bunker",        rect:[6.2, 3.6, 7.0, 4.2], height:0.5 },
      { id:"sc",  code:"S-CES",name:"Solár Cesta",            nameEn:"Solar Road",          rect:[7.6, 4.4, 8.4, 5.0], height:0.2 },

      // Západ & Východ
      { id:"zst", code:"Z-STR",name:"Základna Střelnice",     nameEn:"Shooting Range Base", rect:[1.4, 5.6, 2.4, 6.4], height:1.0 },
      { id:"zs",  code:"Z-SOL",name:"Základna Solár",          nameEn:"Solar Base",          rect:[7.2, 7.2, 8.2, 8.0], height:1.0 },

      // Střed
      { id:"ou",  code:"O-UDAR",name:"Odpaliště u Baráku",    nameEn:"House Launchpad",     rect:[3.7, 4.6, 4.5, 5.2], height:0.3 },
      { id:"fox", code:"FOX",  name:"Foxhole",                nameEn:"Foxhole",             rect:[3.9, 5.8, 4.6, 6.4], height:0.3 },
      { id:"osol",code:"O-SOL",name:"Odpaliště Solár",        nameEn:"Solar Launchpad",     rect:[6.0, 5.8, 6.8, 6.4], height:0.3 },
      { id:"str", code:"STR",  name:"Stronghold",             nameEn:"Stronghold",          rect:[2.4, 6.6, 3.4, 7.3], height:0.6 },
      { id:"zk",  code:"ZKR",  name:"Zkrácená",               nameEn:"Shortened Bldg",      rect:[3.6, 6.2, 4.6, 6.8], height:1.2 },
      { id:"kop", code:"KOP",  name:"Kopec & Bunkr",          nameEn:"Hill & Bunker",       rect:[4.0, 7.4, 5.6, 8.2], height:1.4 },
      { id:"ukr", code:"UKR",  name:"Úkryt",                  nameEn:"Hideout",             rect:[4.4, 8.4, 5.2, 9.0], height:0.5 },
      { id:"prj", code:"PRE",  name:"Přejezd",                nameEn:"Crossing",            rect:[6.4, 8.6, 7.2, 9.2], height:0.2 },

      // Dolní pásmo
      { id:"j",   code:"JNG",  name:"Jungle",                 nameEn:"Jungle",              rect:[3.6, 9.0, 4.4, 9.6], height:0.3 },
      { id:"m",   code:"MOST", name:"Můstek",                 nameEn:"Bridge",              rect:[4.2, 10.2, 5.0, 10.8], height:0.4 },
      { id:"osai",code:"O-SAI",name:"Odpaliště Saigon",       nameEn:"Saigon Launchpad",    rect:[5.6, 10.4, 6.4, 11.0], height:0.3 },
      { id:"oc",  code:"OBL",  name:"Oblouk Cesta",           nameEn:"Arch Road",           rect:[3.4, 11.4, 4.2, 12.0], height:0.2 },
      { id:"bsai",code:"B-SAI",name:"Bunkr Saigon",           nameEn:"Saigon Bunker",       rect:[5.8, 11.6, 6.6, 12.2], height:0.5 }
    ]
  };

  const svg = document.getElementById("map-svg");
  const listEl = document.getElementById("poi-list");

  const LABELS = {
    cs: { back:"Zpět na hřiště", sidebar:"Místa na hřišti" },
    en: { back:"Back to fields", sidebar:"Points of interest" }
  };

  function applyStaticText(lang) {
    document.getElementById("back-label").textContent = LABELS[lang].back;
    document.getElementById("sidebar-title").textContent = LABELS[lang].sidebar;
  }

AM.wireDropdowns();

applyStaticText(AM.getLang());

document.getElementById("back-btn").addEventListener("click", () => {
  window.location.href = "menu.html";
});

const engine = MapEngine.init({
  svg,
  listEl,
  data: FIELD_DATA,
  getLang: AM.getLang,
  mountModeToggle: {
    btn2d: document.getElementById("btn-2d"),
    btn3d: document.getElementById("btn-3d")
  }
});

AM.wireLangSwitch((lang) => {
  applyStaticText(lang);
  engine.redraw();
});
  const LOCATE_TEXT = {
    cs: { btn:"Moje poloha", on:"Sleduji polohu", outside:"Jsi mimo hřiště",
          denied:"Poloha zamítnuta v prohlížeči", unavailable:"Polohu se nepodařilo zjistit",
          noAnchors:"Pro toto hřiště není poloha dostupná" },
    en: { btn:"My location", on:"Tracking location", outside:"You are outside the field",
          denied:"Location permission denied", unavailable:"Could not get location",
          noAnchors:"Location isn't available for this field" }
  };

  const locateBtn = document.getElementById("locate-btn");
  const locateLabel = document.getElementById("locate-label");
  const locateStatus = document.getElementById("locate-status");
  let watchId = null, tracking = false;

  const hasGeo = FIELD_DATA.geoAnchors && FIELD_DATA.geoAnchors.length >= 3
    && FIELD_DATA.geoAnchors.every(a => a.lat && a.lng);

  if (!hasGeo) {
    locateBtn.style.display = "none";
  } else {
    locateBtn.addEventListener("click", () => {
      const lang = AM.getLang();
      if (tracking) {
        AMGeo.stop(watchId); watchId = null; tracking = false;
        locateBtn.classList.remove("active", "outside");
        locateLabel.textContent = LOCATE_TEXT[lang].btn;
        locateStatus.textContent = "";
        engine.setPlayer(null);
        return;
      }
      tracking = true;
      locateBtn.classList.add("active");
      locateLabel.textContent = LOCATE_TEXT[lang].on;

      watchId = AMGeo.watch(FIELD_DATA, (result) => {
        const t = LOCATE_TEXT[AM.getLang()];
        if (!result.ok) {
          locateStatus.textContent = t[result.reason] || t.unavailable;
          locateBtn.classList.remove("outside");
          engine.setPlayer(null);
          return;
        }
        if (result.inside) {
          locateBtn.classList.remove("outside");
          locateStatus.textContent = "";
          engine.setPlayer({ col: result.col, row: result.row });
        } else {
          locateBtn.classList.add("outside");
          locateStatus.textContent = t.outside;
          engine.setPlayer(null);
        }
      });
    });
  }
</script>

</body>
</html>
