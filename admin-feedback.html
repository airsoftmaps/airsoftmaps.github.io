<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRSOFT MAPS — Admin: Zpětná vazba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css?v=3">
<style>
  .ad-wrap {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px 60px;
  }

  .ad-login {
    max-width: 360px;
    margin: 80px auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
  }

  .ad-login input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-body);
    padding: 10px 12px;
    box-sizing: border-box;
    margin-bottom: 12px;
  }

  .ad-login button, .ad-logout {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #101214;
    font-family: var(--font-body);
    font-weight: 700;
    cursor: pointer;
  }

  .ad-err { color: #ff5a5a; font-family: var(--font-body); margin-top: 10px; }

  .ad-filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .ad-filter {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 14px;
  }

  .ad-filter.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }

  .ad-item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 14px;
  }

  .ad-item-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .ad-tag {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    text-transform: uppercase;
  }

  .ad-tag.bug { background: rgba(255,90,90,.15); color: #ff5a5a; }
  .ad-tag.wish { background: rgba(255,196,0,.15); color: #ffc400; }
  .ad-tag.other { background: rgba(120,170,255,.15); color: #78aaff; }

  .ad-meta { color: var(--muted-2); font-size: 13px; font-family: var(--font-body); }

  .ad-message {
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    white-space: pre-wrap;
    margin-bottom: 10px;
  }

  .ad-email {
    color: var(--accent);
    font-family: var(--font-body);
    font-size: 13px;
    margin-bottom: 10px;
  }

  .ad-reply {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-body);
    padding: 8px 10px;
    box-sizing: border-box;
    min-height: 60px;
    margin-bottom: 8px;
  }

  .ad-row-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .ad-row-actions button {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-family: var(--font-body);
    cursor: pointer;
    font-size: 13px;
  }

  .ad-row-actions button.primary {
    border-color: var(--accent);
    color: var(--accent);
  }

  .ad-empty { color: var(--muted); font-family: var(--font-body); text-align: center; margin-top: 40px; }
</style>
</head>
<body>

<header class="am-header">
  <a class="am-brand" href="menu.html">
    <img class="am-brand-logo" src="logos/logoam.png" alt="Airsoft Maps">
  </a>
  <div class="am-field-title">ADMIN — ZPĚTNÁ VAZBA</div>
  <div class="am-controls">
    <button class="am-btn" id="logout-btn" style="display:none;">Odhlásit</button>
  </div>
</header>

<div id="login-screen" class="ad-login">
  <label class="fb-label" style="font-family:var(--font-body); display:block; margin-bottom:8px;">E-mail</label>
  <input id="login-email" type="email" placeholder="tvuj@email.cz">
  <label class="fb-label" style="font-family:var(--font-body); display:block; margin-bottom:8px;">Heslo</label>
  <input id="login-password" type="password" placeholder="Heslo">
  <button id="login-btn">Přihlásit</button>
  <div class="ad-err" id="login-err"></div>
</div>

<div class="ad-wrap" id="admin-screen" style="display:none;">
  <div class="ad-filters">
    <div class="ad-filter active" data-status="all">Vše</div>
    <div class="ad-filter" data-status="new">Nové</div>
    <div class="ad-filter" data-status="seen">Přečtené</div>
    <div class="ad-filter" data-status="resolved">Vyřešené</div>
  </div>
  <div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://zebxstyuyaneuwcaxugf.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplYnhzdHl1eWFuZXV3Y2F4dWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MjY3NTksImV4cCI6MjEwMzEwMjc1OX0.EsCbgnaX6wFUNhh9EHfZGtfT_P4LHGwQpDLhhSpy3SU";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginScreen = document.getElementById("login-screen");
  const adminScreen = document.getElementById("admin-screen");
  const logoutBtn = document.getElementById("logout-btn");
  const listEl = document.getElementById("list");

  let currentFilter = "all";
  let rows = [];

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const errEl = document.getElementById("login-err");
    errEl.textContent = "";

        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      errEl.textContent = "Špatný e-mail nebo heslo.";
      return;
    }

    showAdmin();
  });

  logoutBtn.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    location.reload();
  });

  document.querySelectorAll(".ad-filter").forEach(el => {
    el.addEventListener("click", () => {
      document.querySelectorAll(".ad-filter").forEach(o => o.classList.remove("active"));
      el.classList.add("active");
      currentFilter = el.dataset.status;
      renderList();
    });
  });

  async function showAdmin() {
    loginScreen.style.display = "none";
    adminScreen.style.display = "block";
    logoutBtn.style.display = "inline-block";
    await loadFeedback();
  }

  async function loadFeedback() {
        const { data, error } = await supabaseClient
      .from("feedback")
      .select("*")
      .order("created_at", { ascending: false });

    if (!error) {
      rows = data;
      renderList();
    }
  }

  function renderList() {
    const filtered = currentFilter === "all"
      ? rows
      : rows.filter(r => r.status === currentFilter);

    if (filtered.length === 0) {
      listEl.innerHTML = `<div class="ad-empty">Žádné zprávy.</div>`;
      return;
    }

    listEl.innerHTML = filtered.map(r => `
      <div class="ad-item" data-id="${r.id}">
        <div class="ad-item-top">
          <div>
            <span class="ad-tag ${r.type}">${r.type}</span>
            ${r.field ? `<span class="ad-meta">· ${r.field}</span>` : ""}
          </div>
          <span class="ad-meta">${new Date(r.created_at).toLocaleString("cs-CZ")}</span>
        </div>
        <div class="ad-message">${escapeHtml(r.message)}</div>
        ${r.email ? `<div class="ad-email">✉ ${escapeHtml(r.email)}</div>` : ""}
        <textarea class="ad-reply" placeholder="Odpověď (nepovinné, jen pro tvou evidenci)...">${r.reply ? escapeHtml(r.reply) : ""}</textarea>
        <div class="ad-row-actions">
          <button class="primary" onclick="saveReply('${r.id}')">Uložit odpověď</button>
          <button onclick="setStatus('${r.id}', 'seen')">Označit jako přečtené</button>
          <button onclick="setStatus('${r.id}', 'resolved')">Označit jako vyřešené</button>
        </div>
      </div>
    `).join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  window.saveReply = async function(id) {
    const item = document.querySelector(`.ad-item[data-id="${id}"]`);
    const reply = item.querySelector(".ad-reply").value;

    await supabaseClient.from("feedback").update({ reply, status: "seen" }).eq("id", id);
    await loadFeedback();
  };

  window.setStatus = async function(id, status) {
    await supabaseClient.from("feedback").update({ status }).eq("id", id);
    await loadFeedback();
  };

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      showAdmin();
    }
  })();
</script>

</body>
</html>
