<body>

<header class="am-header">
  <a class="am-brand" href="menu.html">
     <img
      class="am-brand-logo"
      src="loga/tmavekulate.png"
      alt="Airsoft Maps"
  >
  </a>

  <div class="am-breadcrumb">
    <span>Airsoft Maps</span><span class="sep">/</span><span class="current" id="crumb-current">Hřiště</span>
  </div>

  <div class="am-controls">
    <a class="am-btn" href="feedback.html" title="Nahlásit chybu nebo nápad">💬</a>
    <div class="am-dd" id="lang-dd">
      <button class="am-btn">🌐 <span id="lang-current">CZ</span></button>
      <div class="am-dd-menu">
        <button data-lang="cs">Čeština</button>
        <button data-lang="en">English</button>
      </div>
    </div>
    <div class="am-dd" id="style-dd">
      <button class="am-btn">🎨 <span data-i18n="style">Styl</span></button>
      <div class="am-dd-menu">
        <button data-theme="dark" class="active">Tmavý</button>
        <button data-theme="light">Světlý</button>
        <button data-theme="resident-evil">Resident Evil</button>
        <button data-theme="pubg">PUBG</button>

      </div>
    </div>
  </div>
</header>

<main class="am-explorer">

  <div class="am-menu-heading">
    <div class="am-menu-kicker">
      <span class="am-kicker-line"></span>
      <span data-i18n="menuKicker">BATTLEFIELD DATABASE</span>
      <span class="am-kicker-line"></span>
    </div>

    <h1 data-i18n="menuTitle">HŘIŠTĚ</h1>

    <p class="am-menu-subtitle" data-i18n="menuSubtitle">
      Vyber bojiště a vstup do mapy
    </p>
  </div>

  <div class="am-toolbar-row">

    <div class="am-search">
      <span class="icon">⌕</span>
      <input
        type="text"
        id="field-search"
        placeholder="Hledat podle názvu..."
      >
    </div>

    <div class="am-field-count">
      <span id="field-count">0</span>
      <span data-i18n="available">BATTLEFIELDS</span>
    </div>

  </div>

  <div class="am-table">

    <div class="am-table-head">
      <div data-i18n="colName">Název</div>
      <div data-i18n="colLocation">Lokalita</div>
      <div data-i18n="colStatus">Stav</div>
    </div>

    <div id="field-rows"></div>

  </div>

</main>



<script src="common.js?v=3"></script>
<script>
  const BATTLEFIELDS = [
    { id: "dalov",          href: "dalov.html",          name: "Airsoft park Dalov",         nameEn: "Airsoft park Dalov",         location: "Dalov",        status: "active" },
    { id: "grygov",         href: "null",                name: "Airsoft park Grygov",        nameEn: "Airsoft park Grygov",        location: "Grygov",       status: "coming_soon" },
    { id: "mokra_horakov", href: "mokra_horakov.html",  name: "Airsoft park Mokrá Horákov", nameEn: "Airsoft park Mokra-Horakov", location: "Mokra-Horákov",status: "active" },
    { id: "battle_ostrava", href: "null",                name: "Battle Aréna Ostrava",       nameEn: "Battle arena Ostrava",       location: "Ostrava",      status: "coming_soon" },
    { id: "doubrava",       href: "doubrava.html",                name: "Airsoft Park Doubrava",      nameEn: "Airsoft park Doubrava",      location: "Doubrava",     status: "active" },
    { id: "paskov",         href: "null",                name: "Action Aréna Paskov",        nameEn: "Action arena Paskov",        location: "Paskov",       status: "coming_soon" },
    { id: "respawn",        href: "null",                name: "Aréál Respawn z.s.",         nameEn: "Respawn z.s. Area",          location: "Frýdek-Místek",status: "coming_soon" },
  ];

 const TEXT = {
  cs: {
    crumb: "Hřiště",
    menuKicker: "DATABÁZE BOJIŠŤ",
    menuTitle: "HŘIŠTĚ",
    menuSubtitle: "Vyber bojiště a vstup do mapy",
    available: "HŘIŠŤ",
    search: "Hledat podle názvu...",
    colName: "Název",
    colLocation: "Lokalita",
    colStatus: "Stav",
    active: "Aktivní",
    soon: "Připravujeme",
    empty: "Žádné hřiště nenalezeno."
  },

  en: {
    crumb: "Battlefields",
    menuKicker: "BATTLEFIELD DATABASE",
    menuTitle: "BATTLEFIELDS",
    menuSubtitle: "Select a battlefield and enter the map",
    available: "BATTLEFIELDS",
    search: "Search by name...",
    colName: "Name",
    colLocation: "Location",
    colStatus: "Status",
    active: "Active",
    soon: "Coming soon",
    empty: "No battlefields found."
  }
};

  const rowsEl = document.getElementById("field-rows");
  const searchEl = document.getElementById("field-search");

  function render(query) {
    const lang = AM.getLang();
    const t = TEXT[lang];
    const q = (query || "").trim().toLowerCase();
    rowsEl.innerHTML = "";

    document.getElementById("crumb-current").textContent = t.crumb;
    searchEl.placeholder = t.search;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (t[key]) el.textContent = t[key];
    });

    const filtered = BATTLEFIELDS.filter(f => (lang === "en" ? f.nameEn : f.name).toLowerCase().includes(q));
const countEl = document.getElementById("field-count");

if (countEl) {
  countEl.textContent = String(filtered.length).padStart(2, "0");
}
    if (filtered.length === 0) {
      rowsEl.innerHTML = `<div class="am-empty">${t.empty}</div>`;
      return;
    }

    filtered.forEach(f => {
      const soon = f.status === "coming_soon";
      const name = lang === "en" ? f.nameEn : f.name;
      const row = document.createElement("div");
      row.className = "am-row" + (soon ? " disabled" : "");
      row.innerHTML = `
        <div class="am-row-name">
          <svg class="am-row-icon" width="20" height="20" style="width:20px; height:20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>
          </svg>
          <b>${name}</b>
        </div>
        <div class="am-row-location">${f.location}</div>
        <div><span class="am-badge ${soon ? 'soon' : 'active'}">${soon ? t.soon : t.active}</span></div>
      `;
      if (!soon) row.addEventListener("click", () => window.location.href = f.href);
      rowsEl.appendChild(row);
    });
  }

  AM.wireDropdowns();
  AM.wireStyleSwitch();
  AM.wireLangSwitch(() => render(searchEl.value));
  searchEl.addEventListener("input", e => render(e.target.value));
  render("");
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js")
      .catch(err => console.error("Service Worker:", err));
  });
}
</script>
  <div class="pwa-install" id="pwa-install">

  <img
    class="pwa-install-icon"
    src="loga/tmavekulate.png"
    alt=""
  >

  <div class="pwa-install-text">
    <div class="pwa-install-title">
      Přidat Airsoft Maps
    </div>

    <div class="pwa-install-sub">
      Měj mapy hřišť po ruce na ploše telefonu.
    </div>
  </div>

  <button class="pwa-install-btn" id="pwa-install-btn">
    Přidat
  </button>

  <button class="pwa-install-close" id="pwa-install-close">
    ×
  </button>

</div>
  <script>
let deferredPrompt = null;

const pwaInstall = document.getElementById("pwa-install");
const pwaInstallBtn = document.getElementById("pwa-install-btn");
const pwaInstallClose = document.getElementById("pwa-install-close");

const isStandalone =
  window.matchMedia("(display-mode: standalone)").matches ||
  window.navigator.standalone === true;

const isMobile =
  /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

if (isMobile && !isStandalone) {

  window.addEventListener("beforeinstallprompt", event => {

    event.preventDefault();

    deferredPrompt = event;

    pwaInstall.classList.add("show");

  });

}

pwaInstallBtn.addEventListener("click", async () => {

  if (!deferredPrompt) return;

  deferredPrompt.prompt();

  const result = await deferredPrompt.userChoice;

  deferredPrompt = null;

  pwaInstall.classList.remove("show");

});

pwaInstallClose.addEventListener("click", () => {

  pwaInstall.classList.remove("show");

});

window.addEventListener("appinstalled", () => {

  pwaInstall.classList.remove("show");

});
</script>
</body>
</html>
