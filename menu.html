<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRSOFT MAPS — Hřiště</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>

<header class="am-header">
  <a class="am-brand" href="menu.html">
    <img src="logos/Tymove logo B.png" alt="Airsoft Maps">
    <span>AIRSOFT <em>MAPS</em></span>
  </a>

  <div class="am-breadcrumb">
    <span>Airsoft Maps</span><span class="sep">/</span><span class="current" id="crumb-current">Hřiště</span>
  </div>

  <div class="am-controls">
    <div class="am-dd" id="lang-dd">
      <button class="am-btn">🌐 <span id="lang-current">CZ</span></button>
      <div class="am-dd-menu">
        <button data-lang="cs">Čeština</button>
        <button data-lang="en">English</button>
      </div>
    </div>
    <div class="am-dd" id="style-dd">
      <button class="am-btn">🎨 <span data-i18n="style">Styl</span></button>
      <div class="am-dd-menu">
        <button data-theme="dark" class="active">Tmavý</button>
        <button data-theme="light">Světlý</button>
        <button data-theme="resident-evil">Resident Evil</button>
        <button data-theme="pubg">PUBG</button>
        <button data-theme="fortnite">Fortnite</button>
      </div>
    </div>
  </div>
</header>

<div class="am-explorer">
  <div class="am-toolbar-row">
    <div class="am-search">
      <span class="icon">⌕</span>
      <input type="text" id="field-search" placeholder="Hledat podle názvu...">
    </div>
  </div>

  <div class="am-table">
    <div class="am-table-head">
      <div data-i18n="colName">Název</div>
      <div data-i18n="colLocation">Lokalita</div>
      <div data-i18n="colStatus">Stav</div>
    </div>
    <div id="field-rows"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
  const BATTLEFIELDS = [
    { id: "dalov",  href: "dalov.html",  name: "Dalov",  nameEn: "Dalov",  location: "Dalov",  status: "active" },
    { id: "grygov", href: "grygov.html", name: "Grygov", nameEn: "Grygov", location: "Grygov", status: "coming_soon" }
  ];

  const TEXT = {
    cs: { crumb: "Hřiště", search: "Hledat podle názvu...", colName: "Název", colLocation: "Lokalita", colStatus: "Stav", active: "Aktivní", soon: "Připravujeme", empty: "Žádné hřiště nenalezeno.", style: "Styl" },
    en: { crumb: "Battlefields", search: "Search by name...", colName: "Name", colLocation: "Location", colStatus: "Status", active: "Active", soon: "Coming soon", empty: "No battlefields found.", style: "Style" }
  };

  const rowsEl = document.getElementById("field-rows");
  const searchEl = document.getElementById("field-search");

  function render(query) {
    const lang = AM.getLang();
    const t = TEXT[lang];
    const q = (query || "").trim().toLowerCase();
    rowsEl.innerHTML = "";

    document.getElementById("crumb-current").textContent = t.crumb;
    searchEl.placeholder = t.search;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (t[key]) el.textContent = t[key];
    });

    const filtered = BATTLEFIELDS.filter(f => (lang === "en" ? f.nameEn : f.name).toLowerCase().includes(q));

    if (filtered.length === 0) {
      rowsEl.innerHTML = `<div class="am-empty">${t.empty}</div>`;
      return;
    }

    filtered.forEach(f => {
      const soon = f.status === "coming_soon";
      const name = lang === "en" ? f.nameEn : f.name;
      const row = document.createElement("div");
      row.className = "am-row" + (soon ? " disabled" : "");
      row.innerHTML = `
        <div class="am-row-name">
          <svg class="am-row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>
          </svg>
          <b>${name}</b>
        </div>
        <div class="am-row-location">${f.location}</div>
        <div><span class="am-badge ${soon ? 'soon' : 'active'}">${soon ? t.soon : t.active}</span></div>
      `;
      if (!soon) row.addEventListener("click", () => window.location.href = f.href);
      rowsEl.appendChild(row);
    });
  }

  AM.wireDropdowns();
  AM.wireStyleSwitch();
  AM.wireLangSwitch(() => render(searchEl.value));
  searchEl.addEventListener("input", e => render(e.target.value));
  render("");
</script>

</body>
</html>
