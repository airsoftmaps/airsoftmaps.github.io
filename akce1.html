<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta property="og:title" content="Airsoft Maps — Akce">
<meta property="og:description" content="Airsoftové akce">
<meta property="og:image" content="https://airsoftmaps.github.io/loga/bilekulate.png">
<meta property="og:url" content="https://airsoftmaps.github.io/akce.html">
<meta property="og:type" content="website">

<title>AIRSOFT MAPS — AKCE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css?v=3">

<meta name="theme-color" content="#ff7a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Airsoft Maps">
<link rel="apple-touch-icon" href="/loga/tmavekulate.png">

<style>
/* =========================================================
   AIRSOFT MAPS — CINEMATIC EVENTS SCREEN
   Zcela přepracovaný zážitek s podporou témat
   ========================================================= */

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--font-body);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ---------------------------------------------------------
   TOP BAR (Back Button)
   --------------------------------------------------------- */
.event-topbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 24px;
  z-index: 20;
}

.event-back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .18em;
  text-decoration: none;
  text-transform: uppercase;
  backdrop-filter: blur(8px);
  transition: all .2s ease;
}

.event-back:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-dim);
  transform: translateX(-3px);
}

/* ---------------------------------------------------------
   MAIN CINEMATIC CONTAINER
   --------------------------------------------------------- */
.am-event-cinematic {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  isolation: isolate;
  overflow: hidden;
}

/* Atmospheric Layers */
.am-atmosphere, .am-particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

/* ---------------------------------------------------------
   CONTENT
   --------------------------------------------------------- */
.event-content {
  position: relative;
  width: min(850px, 90vw);
  text-align: center;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.event-logo {
  width: 82px;
  height: 82px;
  object-fit: contain;
  margin-bottom: 24px;
  opacity: 0;
  filter: drop-shadow(0 0 20px var(--accent-dim));
  animation: logoIn 1.2s cubic-bezier(.2,.8,.2,1) .2s forwards;
}

.event-kicker {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 12px;
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .32em;
  text-transform: uppercase;
  opacity: 0;
  animation: fadeUp .8s ease .6s forwards;
}

.event-kicker-line {
  width: 45px;
  height: 1px;
  background: currentColor;
  opacity: .5;
}

.event-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(50px, 12vw, 130px);
  line-height: .9;
  letter-spacing: .025em;
  text-transform: uppercase;
  color: var(--text);
  opacity: 0;
  animation: cinematicTitle 1.5s cubic-bezier(.16,1,.3,1) .8s forwards;
}

.event-subtitle {
  margin: 16px auto 0;
  max-width: 600px;
  color: var(--muted);
  font-size: 15px;
  letter-spacing: .08em;
  text-transform: uppercase;
  opacity: 0;
  animation: fadeUp .8s ease 1.1s forwards;
}

/* ---------------------------------------------------------
   LOADING SYSTEM
   --------------------------------------------------------- */
.event-loading {
  width: min(460px, 80vw);
  margin: 40px auto 0;
  opacity: 0;
  animation: fadeUp .8s ease 1.4s forwards;
}

.event-loading-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  color: var(--muted-2);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
}

#loading-percent { color: var(--accent); }

.loading-bar {
  position: relative;
  width: 100%;
  height: 3px;
  background: var(--border);
  overflow: hidden;
  border-radius: 2px;
}

.loading-progress {
  position: absolute;
  left: 0; top: 0;
  width: 0%;
  height: 100%;
  background: var(--accent);
  box-shadow: 0 0 15px var(--accent);
  transition: width .1s linear;
}

/* ---------------------------------------------------------
   ENTER BUTTON & DISCLAIMER
   --------------------------------------------------------- */
.event-enter-wrapper {
  margin-top: 36px;
  opacity: 0;
  transform: translateY(15px);
  pointer-events: none;
  transition: all .4s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.event-enter-wrapper.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.event-enter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 260px;
  padding: 16px 32px;
  border: 1px solid var(--accent);
  background: var(--accent-dim);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s ease;
}

.event-enter:hover {
  background: var(--accent);
  color: #000;
  box-shadow: 0 0 25px var(--theme-glow-strong);
}

.event-enter span:last-child {
  margin-left: 12px;
  font-size: 18px;
}

.event-disclaimer {
  color: var(--muted-2);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

/* ---------------------------------------------------------
   BOTTOM STATUS & COPYRIGHT
   --------------------------------------------------------- */
.event-footer {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 16px;
  z-index: 20;
}

.event-status {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted-2);
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  opacity: 0;
  animation: fadeUp .8s ease 1.8s forwards;
  margin-bottom: 12px;
}

.event-status::before {
  content: "";
  width: 6px; height: 6px;
  margin-right: 10px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

/* ---------------------------------------------------------
   FADE OVERLAY
   --------------------------------------------------------- */
.event-fade {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--bg-0);
  opacity: 0;
  pointer-events: none;
  transition: opacity .6s ease;
}
.event-fade.active { opacity: 1; }

/* ---------------------------------------------------------
   ANIMATIONS
   --------------------------------------------------------- */
@keyframes logoIn {
  0% { opacity: 0; transform: scale(.7) rotate(-5deg); filter: blur(10px); }
  100% { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); }
}

@keyframes cinematicTitle {
  0% { opacity: 0; transform: scale(1.1) translateY(20px); filter: blur(15px); }
  100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* =========================================================
   THEME SPECIFICS (The Magic happens here)
   ========================================================= */

/* --- DARK (Default Tactical) --- */
html[data-theme="dark"] .am-atmosphere {
  background: radial-gradient(circle at 50% 50%, var(--theme-glow), transparent 60%);
}
html[data-theme="dark"] .am-event-cinematic::before {
  content: ""; position: absolute; inset: -50%;
  background-image: linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
  background-size: 40px 40px;
  transform: perspective(600px) rotateX(60deg) translateY(0);
  animation: gridMove 15s linear infinite;
  pointer-events: none;
}
@keyframes gridMove { to { transform: perspective(600px) rotateX(60deg) translateY(40px); } }

/* --- LIGHT (Clean/Corporate Military) --- */
html[data-theme="light"] .am-atmosphere {
  background: radial-gradient(circle at 50% 0%, rgba(196,81,0,.08), transparent 60%);
}
html[data-theme="light"] .event-title {
  text-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
html[data-theme="light"] .loading-bar { background: #d0d4d6; }

/* --- RESIDENT EVIL (Horror, Blood, Glitch) --- */
html[data-theme="resident-evil"] .am-atmosphere {
  background: radial-gradient(circle at 50% 50%, rgba(170,0,0,.15), transparent 70%);
}
html[data-theme="resident-evil"] .am-event-cinematic::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,.3) 3px);
  pointer-events: none; z-index: 2;
}
html[data-theme="resident-evil"] .event-title {
  font-family: Georgia, serif; letter-spacing: .1em; color: #fff;
  text-shadow: 2px 0 10px red, -2px 0 15px darkred;
  animation: cinematicTitle 1.5s forwards, reGlitch 4s infinite 2s;
}
html[data-theme="resident-evil"] .event-loading-top { font-family: monospace; letter-spacing: .2em; color: #a69a97; }
html[data-theme="resident-evil"] .loading-bar { background: #3b1515; height: 4px; }
html[data-theme="resident-evil"] .loading-progress { box-shadow: 0 0 20px red; }
html[data-theme="resident-evil"] .event-enter { border-color: #542020; background: rgba(100,0,0,.2); }
html[data-theme="resident-evil"] .event-enter:hover { background: #d71920; color: #fff; box-shadow: 0 0 30px rgba(215,25,32,.4); }

@keyframes reGlitch {
  0%, 96%, 98%, 100% { transform: translate(0,0); opacity: 1; filter: drop-shadow(0 0 10px red); }
  97% { transform: translate(-3px, 2px); opacity: .8; filter: drop-shadow(2px 0 0px blue); }
  99% { transform: translate(3px, -2px); opacity: .9; filter: drop-shadow(-2px 0 0px yellow); }
}

/* --- PUBG (Gritty, Tactical, Yellow) --- */
html[data-theme="pubg"] .am-atmosphere {
  background: radial-gradient(circle at 50% 50%, rgba(215,169,40,.08), transparent 70%),
              repeating-linear-gradient(45deg, rgba(255,255,255,.01) 0px, rgba(255,255,255,.01) 2px, transparent 2px, transparent 10px);
}
html[data-theme="pubg"] .event-title {
  font-family: 'Rajdhani', sans-serif; font-weight: 700;
  text-shadow: 3px 3px 0 #000;
}
html[data-theme="pubg"] .loading-bar { background: #2d3126; height: 6px; border-radius: 0; }
html[data-theme="pubg"] .event-enter { border-radius: 0; border: 2px solid var(--accent); font-weight: 800; }
html[data-theme="pubg"] .event-enter:hover { background: var(--accent); color: #111; }

/* --- FORTNITE (Vibrant, Skewed, Bouncy) --- */
html[data-theme="fortnite"] .am-atmosphere {
  background: radial-gradient(circle at 20% 20%, rgba(157,92,255,.2), transparent 40%),
              radial-gradient(circle at 80% 80%, rgba(39,194,255,.15), transparent 40%);
}
html[data-theme="fortnite"] .event-title {
  font-family: 'Anton', sans-serif; transform: skew(-6deg);
  text-shadow: 4px 4px 0 #9d5cff, 8px 8px 0 rgba(39,194,255,.4);
}
html[data-theme="fortnite"] .event-enter {
  border-radius: 6px; transform: skew(-4deg); border: none;
  background: linear-gradient(135deg, #9d5cff, #27c2ff);
  box-shadow: 0 6px 0 #11101d;
}
html[data-theme="fortnite"] .event-enter:hover {
  transform: skew(-4deg) translateY(-3px);
  box-shadow: 0 9px 0 #11101d, 0 0 25px rgba(157,92,255,.5);
}
html[data-theme="fortnite"] .loading-bar { border-radius: 10px; height: 6px; background: #26203e; }
html[data-theme="fortnite"] .loading-progress { background: #fcfd00; box-shadow: 0 0 15px #fcfd00; }
html[data-theme="fortnite"] #loading-percent { color: #fcfd00; }

/* ---------------------------------------------------------
   MOBILE
   --------------------------------------------------------- */
@media (max-width: 600px) {
  .event-topbar { padding: 16px; }
  .event-logo { width: 60px; height: 60px; }
  .event-kicker { font-size: 9px; letter-spacing: .2em; }
  .event-kicker-line { width: 30px; }
  .event-subtitle { font-size: 12px; }
  .event-enter { min-width: 100%; padding: 14px 20px; font-size: 13px; }
}
</style>
</head>

<body>

<div class="event-topbar">
  <a href="menu.html" class="event-back">
    ← <span>ZPĚT</span>
  </a>
</div>

<div class="am-event-cinematic">
  <div class="am-atmosphere"></div>
  <div class="am-particles"></div>

  <div class="event-content">
    <img class="event-logo" src="loga/tmavekulate.png" alt="Airsoft Maps">

    <div class="event-kicker">
      <span class="event-kicker-line"></span>
      <span id="event-kicker">AIRSOFT MAPS SYSTEM</span>
      <span class="event-kicker-line"></span>
    </div>

    <h1 class="event-title" id="event-title">AKCE</h1>

    <p class="event-subtitle" id="event-subtitle">
      Připravujeme přístup k databázi airsoftových akcí.
    </p>

    <div class="event-loading">
      <div class="event-loading-top">
        <span id="loading-status">INITIALIZING EVENT DATABASE</span>
        <span><span id="loading-percent">0</span>%</span>
      </div>
      <div class="loading-bar">
        <div class="loading-progress" id="loading-progress"></div>
      </div>
    </div>

    <div class="event-enter-wrapper" id="event-enter-wrapper">
      <button class="event-enter" id="event-enter" type="button">
        <span id="enter-text">VSTOUPIT DO AKCÍ</span>
        <span>→</span>
      </button>
      <div class="event-disclaimer" id="event-disclaimer">
        Tlačítko Tě přesměruje na web mapa-airsoft-akci.cz
      </div>
    </div>
  </div>
</div>

<div class="event-footer">
  <div class="event-status" id="event-status">SYSTEM READY</div>
  <div class="am-copyright">
    <span class="am-copyright-symbol">©</span>
    2026 AIRSOFT MAPS. VŠECHNA PRÁVA VYHRAZENA.
  </div>
</div>

<div class="event-fade" id="event-fade"></div>

<script src="common.js?v=3"></script>

<script>
/* =========================================================
   AIRSOFT MAPS — CINEMATIC EVENTS LOGIC
   ========================================================= */

const EVENTS_URL = "https://mapa-airsoft-akci.cz/";

/* ---------------------------------------------------------
   TEXTY (Tématické updaty textu)
   --------------------------------------------------------- */
const TEXT = {
  cs: {
    kicker: "AIRSOFT MAPS SYSTEM",
    title: "AKCE",
    subtitle: "Získej přístup k databázi airsoftových akcí.",
    loading: "NAČÍTÁM DATABÁZI",
    ready: "DATABÁZE PŘIPRAVENA",
    enter: "VSTOUPIT DO AKCÍ",
    status: "SYSTEM READY",
    disclaimer: "Tlačítko Tě přesměruje na web mapa-airsoft-akci.cz"
  },
  en: {
    kicker: "AIRSOFT MAPS SYSTEM",
    title: "EVENTS",
    subtitle: "Get access to the airsoft event database.",
    loading: "LOADING DATABASE",
    ready: "DATABASE READY",
    enter: "ENTER EVENTS",
    status: "SYSTEM READY",
    disclaimer: "You will be redirected to mapa-airsoft-akci.cz"
  }
};

/* ---------------------------------------------------------
   TÉMA
   --------------------------------------------------------- */
function getSavedTheme() {
  const keys = ["am-theme", "theme", "airsoftmaps-theme"];
  for (const key of keys) {
    const value = localStorage.getItem(key);
    if (value) return value;
  }
  return "dark";
}

const savedTheme = getSavedTheme();
document.body.dataset.theme = savedTheme;
document.documentElement.dataset.theme = savedTheme;

/* ---------------------------------------------------------
   LANGUAGE
   --------------------------------------------------------- */
let lang = "cs";
try {
  if (typeof AM !== "undefined" && typeof AM.getLang === "function") {
    lang = AM.getLang();
  }
} catch (e) {}

const t = TEXT[lang] || TEXT.cs;

document.getElementById("event-kicker").textContent = t.kicker;
document.getElementById("event-title").textContent = t.title;
document.getElementById("event-subtitle").textContent = t.subtitle;
document.getElementById("loading-status").textContent = t.loading;
document.getElementById("enter-text").textContent = t.enter;
document.getElementById("event-status").textContent = t.status;
document.getElementById("event-disclaimer").textContent = t.disclaimer;

/* Mírná změna hlášek podle herního stylu pro maximální efekt */
if(savedTheme === "resident-evil") {
    document.getElementById("loading-status").textContent = lang === "cs" ? "DEŠIFRUJI UMBRELLA SÍŤ..." : "DECRYPTING UMBRELLA NET...";
} else if (savedTheme === "pubg") {
    document.getElementById("loading-status").textContent = lang === "cs" ? "PŘÍPRAVA K VÝSADKU..." : "PREPARING FOR AIRDROP...";
} else if (savedTheme === "fortnite") {
    document.getElementById("loading-status").textContent = lang === "cs" ? "PŘIPOJOVÁNÍ K BATTLE BUSU..." : "CONNECTING TO BATTLE BUS...";
}

/* ---------------------------------------------------------
   CINEMATIC LOADING
   --------------------------------------------------------- */
const progress = document.getElementById("loading-progress");
const percent = document.getElementById("loading-percent");
const loadingStatus = document.getElementById("loading-status");
const enterWrapper = document.getElementById("event-enter-wrapper");
const status = document.getElementById("event-status");

let current = 0;

const loadingTimer = setInterval(() => {
  let step;
  if (current < 45) {
    step = Math.random() * 4 + 1;
  } else if (current < 85) {
    step = Math.random() * 2 + 0.5;
  } else {
    step = Math.random() * 0.8 + 0.2;
  }

  current += step;

  if (current >= 100) {
    current = 100;
    clearInterval(loadingTimer);
    
    progress.style.width = "100%";
    percent.textContent = "100";
    
    // Závěrečná hláška podle tématu
    if(savedTheme === "resident-evil") {
        loadingStatus.textContent = lang === "cs" ? "PŘÍSTUP POVOLEN. BIOHAZARD DETEKOVÁN." : "ACCESS GRANTED. BIOHAZARD DETECTED.";
    } else if (savedTheme === "pubg") {
        loadingStatus.textContent = lang === "cs" ? "VÝSADEK PŘIPRAVEN. HODNĚ ŠTĚSTÍ." : "AIRDROP READY. GOOD LUCK.";
    } else if (savedTheme === "fortnite") {
        loadingStatus.textContent = lang === "cs" ? "VŠECHNO PŘIPRAVENO! LET'S GO!" : "ALL SET! LET'S GO!";
    } else {
        loadingStatus.textContent = t.ready;
    }

    status.textContent = "ONLINE";
    status.style.color = "var(--accent)";
    
    enterWrapper.classList.add("visible");
    return;
  }

  progress.style.width = current + "%";
  percent.textContent = Math.floor(current);
}, 60); // O chlup pomalejší timer pro lepší drama

/* ---------------------------------------------------------
   ENTER BUTTON CLICK
   --------------------------------------------------------- */
document.getElementById("event-enter").addEventListener("click", () => {
  const fade = document.getElementById("event-fade");
  fade.classList.add("active");

  setTimeout(() => {
    window.open(EVENTS_URL, "_blank");
    fade.classList.remove("active");
  }, 650);
});

/* ---------------------------------------------------------
   ESCAPE
   --------------------------------------------------------- */
document.addEventListener("keydown", event => {
  if (event.key === "Escape") window.history.back();
});
</script>

</body>
</html>
