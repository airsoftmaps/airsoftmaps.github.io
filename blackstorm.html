<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Storm Airsoft | Mapa hřiště | Airsoft Maps</title>
  <link rel="stylesheet" href="divine.css?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>

<header class="am-header">
  <a class="am-brand" href="menu.html">
    <img class="am-brand-logo" src="loga/tmavekulate.png" alt="Airsoft Maps">
  </a>

  <div class="am-field-title">Airsoft Park — <span>BLACK STORM</span></div>

  <div class="am-controls">
    <button class="am-btn" id="back-btn">← <span id="back-label">Zpět na hřiště</span></button>
    <div class="am-dd" id="lang-dd">
      <button class="am-btn">🌐 <span id="lang-current">CZ</span></button>
      <div class="am-dd-menu">
        <button data-lang="cs">Čeština</button>
        <button data-lang="en">English</button>
      </div>
    </div>
  </div>
</header>

<div class="am-map-toolbar">
  <div class="am-toggle">
    <button id="btn-2d" class="active">2D</button>
    <button id="btn-3d">3D</button>
    <button class="am-locate-btn" id="locate-btn" style="margin-left:10px;">
      <span class="dot"></span><span id="locate-label">Moje poloha</span>
    </button>
  </div>
</div>
<div class="am-locate-status" id="locate-status"></div>

<div class="am-map-body">
  <div class="am-map-canvas">
    <svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="am-sidebar">
    <div class="am-sidebar-title" id="sidebar-title">Místa na hřišti</div>
    <div id="poi-list"></div>
  </div>
</div>

<script src="common.js?v=3"></script>
<script src="geo.js?v=3"></script>
<script src="map-engine.js?v=9"></script>
<script>
const FIELD_DATA = {
    viewBoxFlat: "0 0 1100 850",

    // GPS kotvy podle zadání (přepočteno na mřížku z blackstormgrid.png)
    geoAnchors: [
      { col: 10.19, row: 5.78, lat: 49.00833244519696, lng: 14.474683031483309 },  // v offzóně
      { col: 2.45,  row: 4.77, lat: 49.00862471581455, lng: 14.471475924568766 },  // levá budova, spodní
      { col: 5.20,  row: 3.53, lat: 49.00895757924106, lng: 14.472609112531524 }   // pravá budova, horní
    ],

    // Obvod hřiště podle červené obvodové čáry z gridu (diamant + úzký
    // koridor vybíhající k cestě na Offzónu + obchvat budovy CQB)
    boundary: [
      [3.17, 0.07],
      [4.78, 1.76],
      [4.95, 1.56],
      [6.31, 2.62],
      [6.2, 2.75],
      [6.44, 3.27],
      [6.23, 3.41],
      [6.39, 3.56],
      [6.27, 3.67],
      [7.21, 4.40],
      [6.99, 4.66],
      [6.22, 4.03],
      [3.40, 7.17],
      [-0.22, 3.93],
      [3.17, 0.07]
    ],

    // Oranžová šipka zvenku mířící na vstup (do Offzóny)
    entrance: { col: 9.81, row: 7.21, angle: -169 },

    // Cesta (fialová lomená čára) - od koridoru u CQB až k Offzóně
    roads: [
      { points: [[7.12, 4.54], [7.75, 4.86], [8.92, 4.88], [9.00, 5.70], [9.11, 6.21], [9.25, 6.29]] }
    ],

    walls: [],

    zones: [],

    // Modré budovy z podkladu.
    // Klikací (do seznamu) jsou POUZE CQB a OFFZONA — ostatní modré
    // plochy/budovy jsou vykresleny jako nízké budovy bez kliku.
    buildings: [

      // --- klikací budovy ---
      {
        id: "cqb_1",
        code: "CQB",
        name: "CQB",
        nameEn: "CQB",
        rect: [5.13, 1.48, 5.71, 3.09],
        rotate: -48.8,
        color: "#0064ff",
        height: 0.3
      },
      {
        id: "offzone_1",
        code: "OZ",
        name: "Offzóna",
        nameEn: "Off-Zone",
        rect: [8.34, 6.17, 10.77, 6.79],
        rotate: -48.0,
        color: "#0064ff",
        height: 0.3
      },

      // --- pouze vizuální nízké budovy (bez id -> neklikací) ---
      { rect: [1.75, 3.42, 4.96, 4.07], rotate: -47.1, color: "#0064ff", height: 0.25 },
      { rect: [2.61, 4.25, 5.90, 4.83], rotate: -47.2, color: "#0064ff", height: 0.25 },
      { rect: [3.14, 1.16, 3.60, 1.78], rotate: -48.8, color: "#0064ff", height: 0.25 },
      { rect: [2.01, 1.73, 2.34, 2.17], rotate: -50.2, color: "#0064ff", height: 0.25 },
      { rect: [1.73, 2.16, 2.05, 2.55], rotate: -49.6, color: "#0064ff", height: 0.25 },
      { rect: [1.10, 3.15, 1.41, 3.47], rotate: -42.3, color: "#0064ff", height: 0.25 },
      { rect: [1.89, 2.83, 2.18, 3.07], rotate: -45.0, color: "#0064ff", height: 0.25 },
      { rect: [1.44, 2.93, 1.80, 3.26], rotate: -48.0, color: "#0064ff", height: 0.25 },
      { rect: [1.40, 3.46, 1.76, 3.78], rotate: -48.0, color: "#0064ff", height: 0.25 }
    ]
  };

  /* --------------------------------------------------------------------
     STROMY — zelená plocha z blackstormgrid.png držící mřížku. Místo
     ručního výpisu stovek bodů generujeme mřížku stromů uvnitř obvodu
     hřiště a vynecháváme "mýtinu" (cesty, budovy), přesně podle
     bílé/zelené plochy z podkladového obrázku, jen jemně nepravidelně
     (jitter), ať to nevypadá jako umělé čtverce.
     -------------------------------------------------------------------- */
    const CLEARING = [
    [2.70, 0.90], [5.00, 1.20], [5.90, 1.90], [6.30, 3.90],
    [7.30, 4.60], [6.60, 5.00], [5.00, 5.60], [3.30, 5.90],
    [1.30, 5.00], [0.90, 3.00], [1.30, 1.60]
  ];

  function pointInPolygon(pt, poly) {
    const x = pt[0], y = pt[1];
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1];
      const xj = poly[j][0], yj = poly[j][1];
      const intersect = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function generateTrees(boundary, clearing, spacing) {
    const trees = [];
    let minC = Infinity, maxC = -Infinity, minR = Infinity, maxR = -Infinity;
    boundary.forEach(([c, r]) => {
      minC = Math.min(minC, c); maxC = Math.max(maxC, c);
      minR = Math.min(minR, r); maxR = Math.max(maxR, r);
    });
    for (let r = minR; r <= maxR; r += spacing) {
      for (let c = minC; c <= maxC; c += spacing) {
        // drobný "jitter", ať mřížka nevypadá roboticky / uměle čtvercově
        const jc = c + (Math.random() - 0.5) * spacing * 0.55;
        const jr = r + (Math.random() - 0.5) * spacing * 0.55;
        if (pointInPolygon([jc, jr], boundary) && !pointInPolygon([jc, jr], clearing)) {
          trees.push([Math.round(jc * 100) / 100, Math.round(jr * 100) / 100]);
        }
      }
    }
    return trees;
  }

  FIELD_DATA.trees = generateTrees(FIELD_DATA.boundary, CLEARING, 0.4);

  const svg = document.getElementById("map-svg");
  const listEl = document.getElementById("poi-list");

  const LABELS = {
    cs: { back: "Zpět na hřiště", sidebar: "Místa na hřišti" },
    en: { back: "Back to fields", sidebar: "Points of interest" }
  };

  function applyStaticText(lang) {
    document.getElementById("back-label").textContent = LABELS[lang].back;
    document.getElementById("sidebar-title").textContent = LABELS[lang].sidebar;
  }

  AM.wireDropdowns();

  applyStaticText(AM.getLang());

  document.getElementById("back-btn").addEventListener("click", () => {
    window.location.href = "menu.html";
  });

  const engine = MapEngine.init({
    svg,
    listEl,
    data: FIELD_DATA,
    getLang: AM.getLang,
    mountModeToggle: {
      btn2d: document.getElementById("btn-2d"),
      btn3d: document.getElementById("btn-3d")
    }
  });

  AM.wireLangSwitch((lang) => {
    applyStaticText(lang);
    engine.redraw();
  });

  const LOCATE_TEXT = {
    cs: { btn: "Moje poloha", on: "Sleduji polohu", outside: "Jsi mimo hřiště",
          denied: "Poloha zamítnuta v prohlížeči", unavailable: "Polohu se nepodařilo zjistit",
          noAnchors: "Pro toto hřiště není poloha dostupná" },
    en: { btn: "My location", on: "Tracking location", outside: "You are outside the field",
          denied: "Location permission denied", unavailable: "Could not get location",
          noAnchors: "Location isn't available for this field" }
  };

  const locateBtn = document.getElementById("locate-btn");
  const locateLabel = document.getElementById("locate-label");
  const locateStatus = document.getElementById("locate-status");
  let watchId = null, tracking = false;
  let stopHeading = null, lastHeading = null, lastUpBearing = null, insideField = false;

  const hasGeo = FIELD_DATA.geoAnchors && FIELD_DATA.geoAnchors.length >= 3
    && FIELD_DATA.geoAnchors.every(a => a.lat && a.lng);

  function applyCompassRotation() {
    if (insideField && lastHeading != null && lastUpBearing != null) {
      engine.setCompassRotation((lastUpBearing - lastHeading + 360) % 360);
    } else {
      engine.setCompassRotation(null);
    }
  }

  if (!hasGeo) {
    locateBtn.style.display = "none";
  } else {
    locateBtn.addEventListener("click", () => {
      const lang = AM.getLang();
      if (tracking) {
        AMGeo.stop(watchId); watchId = null; tracking = false;
        if (stopHeading) { stopHeading(); stopHeading = null; }
        insideField = false;
        lastHeading = null;
        applyCompassRotation();
        locateBtn.classList.remove("active", "outside");
        locateLabel.textContent = LOCATE_TEXT[lang].btn;
        locateStatus.textContent = "";
        engine.setPlayer(null);
        return;
      }
      tracking = true;
      locateBtn.classList.add("active");
      locateLabel.textContent = LOCATE_TEXT[lang].on;

      stopHeading = AMGeo.watchHeading((heading) => {
        lastHeading = heading;
        applyCompassRotation();
      });

      watchId = AMGeo.watch(FIELD_DATA, (result) => {
        const t = LOCATE_TEXT[AM.getLang()];
        if (!result.ok) {
          locateStatus.textContent = t[result.reason] || t.unavailable;
          locateBtn.classList.remove("outside");
          engine.setPlayer(null);
          insideField = false;
          applyCompassRotation();
          return;
        }
        lastUpBearing = result.upBearing;
        if (result.inside) {
          locateBtn.classList.remove("outside");
          locateStatus.textContent = "";
          engine.setPlayer({ col: result.col, row: result.row });
          insideField = true;
        } else {
          locateBtn.classList.add("outside");
          locateStatus.textContent = t.outside;
          engine.setPlayer(null);
          insideField = false;
        }
        applyCompassRotation();
      });
    });
  }
</script>
<script src="divine.js?v=1"></script>
</body>
</html>
