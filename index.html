<!DOCTYPE html>
<html lang="cs">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>AIRSOFT MAPS</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;600;700&display=swap"
    rel="stylesheet">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#050608;

    font-family:"Rajdhani",sans-serif;

    cursor:pointer;
}


#stage{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 40%,
            rgba(255,122,26,.06),
            transparent 60%
        ),
        radial-gradient(
            ellipse at 50% 50%,
            #0d1013,
            #000 80%
        );
}


#stage::before{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    opacity:.18;

    background-image:

        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:40px 40px;
}


#stage::after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    box-shadow:
        inset 0 0 20vw 5vw rgba(0,0,0,.9);
}


/* =====================================================
   CINEMATIC BARS
===================================================== */

.bar{

    position:fixed;

    left:0;

    width:100%;

    height:12vh;

    background:#000;

    z-index:30;

    transition:
        transform 1s cubic-bezier(.77,0,.18,1);
}

.bar-top{

    top:0;

    transform:
        translateY(-100%);
}

.bar-bottom{

    bottom:0;

    transform:
        translateY(100%);
}

#stage.bars-in .bar-top{

    transform:
        translateY(0);
}

#stage.bars-in .bar-bottom{

    transform:
        translateY(0);
}


/* =====================================================
   CARDS
===================================================== */

.card{

    position:absolute;

    z-index:10;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .65s ease;
}

.card.show{

    opacity:1;

    pointer-events:none;
}

.card.hide{

    opacity:0;
}


/* =====================================================
   STUDIO
===================================================== */

#card-studio img{

    width:150px;

    height:150px;

    object-fit:contain;

    opacity:0;

    transform:scale(.82);

    filter:
        drop-shadow(
            0 0 25px
            rgba(255,122,26,.25)
        );

    transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.2,.9,.2,1);
}

#card-studio.show img{

    opacity:1;

    transform:scale(1);
}


#studio-name{

    margin-top:22px;

    font-size:15px;

    letter-spacing:.35em;

    text-transform:uppercase;

    color:#eef1f0;

    font-weight:600;

    opacity:0;

    transition:
        opacity .6s ease .3s;
}

#card-studio.show #studio-name{

    opacity:1;
}


#studio-sub{

    margin-top:8px;

    font-size:11px;

    letter-spacing:.4em;

    text-transform:uppercase;

    color:#7f8790;

    opacity:0;

    transition:
        opacity .6s ease .55s;
}

#card-studio.show #studio-sub{

    opacity:1;
}


/* =====================================================
   SPONSORS
===================================================== */

#sponsor-label{

    font-size:11px;

    letter-spacing:.5em;

    text-transform:uppercase;

    color:#7f8790;

    margin-bottom:34px;

    opacity:0;

    transition:
        opacity .5s ease;
}

#card-sponsors.show #sponsor-label{

    opacity:1;
}


#sponsor-grid{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:44px;

    flex-wrap:wrap;

    max-width:820px;
}


#sponsor-grid img{

    height:64px;

    max-width:130px;

    object-fit:contain;

    opacity:0;

    transform:
        translateY(12px);

    transition:
        opacity .5s ease,
        transform .5s ease;
}


#card-sponsors.show #sponsor-grid img{

    opacity:.92;

    transform:
        translateY(0);
}

#card-sponsors.show #sponsor-grid img:nth-child(1){
    transition-delay:.1s;
}

#card-sponsors.show #sponsor-grid img:nth-child(2){
    transition-delay:.2s;
}

#card-sponsors.show #sponsor-grid img:nth-child(3){
    transition-delay:.3s;
}

#card-sponsors.show #sponsor-grid img:nth-child(4){
    transition-delay:.4s;
}

#card-sponsors.show #sponsor-grid img:nth-child(5){
    transition-delay:.5s;
}


/* =====================================================
   TITLE
===================================================== */

#title-wrap{

    opacity:0;

    transform:
        scale(1.12);

    filter:
        blur(7px);

    transition:
        opacity .6s ease,
        transform .8s cubic-bezier(.2,.9,.2,1),
        filter .6s ease;
}

#card-title.show #title-wrap{

    opacity:1;

    transform:
        scale(1);

    filter:
        blur(0);
}


#title{

    font-family:"Anton",sans-serif;

    font-size:
        clamp(52px,10vw,110px);

    line-height:.92;

    letter-spacing:.03em;

    color:#eef1f0;

    text-shadow:
        0 0 40px
        rgba(255,122,26,.35);
}

#title span{

    color:#ff7a1a;
}


#tagline{

    margin-top:12px;

    font-size:14px;

    letter-spacing:.5em;

    text-transform:uppercase;

    color:#9aa2ab;
}


/* =====================================================
   CONTINUE
===================================================== */

#continue-hint{

    position:absolute;

    bottom:14vh;

    left:0;

    right:0;

    text-align:center;

    z-index:20;

    font-size:11px;

    letter-spacing:.35em;

    text-transform:uppercase;

    color:#858d95;

    opacity:0;

    transition:
        opacity .4s ease;
}

#continue-hint.show{

    opacity:1;

    animation:
        blink 1.6s ease-in-out infinite;
}


@keyframes blink{

    0%,
    100%{
        opacity:.25;
    }

    50%{
        opacity:.9;
    }

}


/* =====================================================
   FLASH
===================================================== */

#flash{

    position:fixed;

    inset:0;

    z-index:25;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.85),
            transparent
        );

    width:60%;

    left:-60%;

    opacity:0;
}

#flash.sweep{

    animation:
        sweep .5s ease forwards;
}

@keyframes sweep{

    0%{
        left:-60%;
        opacity:1;
    }

    100%{
        left:110%;
        opacity:0;
    }

}


/* =====================================================
   SKIP
===================================================== */

#skip-btn{

    position:fixed;

    bottom:5vh;

    right:5vw;

    z-index:50;

    background:transparent;

    border:
        1px solid #353a40;

    color:#9ca3aa;

    font-family:"Rajdhani",sans-serif;

    letter-spacing:.15em;

    font-size:11px;

    padding:9px 17px;

    text-transform:uppercase;

    cursor:pointer;

    opacity:0;

    transition:.2s ease;
}

#skip-btn.visible{

    opacity:1;
}

#skip-btn:hover{

    border-color:#ff7a1a;

    color:#ff7a1a;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:640px){

    #sponsor-grid{

        gap:25px;

        max-width:90vw;
    }

    #sponsor-grid img{

        height:42px;

        max-width:85px;
    }

    #studio-name{

        font-size:11px;

        letter-spacing:.22em;
    }

    #studio-sub{

        font-size:9px;
    }

    #tagline{

        font-size:10px;

        letter-spacing:.3em;
    }

}

</style>

</head>


<body>


<div id="stage">

    <div class="bar bar-top"></div>

    <div class="bar bar-bottom"></div>

    <div id="flash"></div>


    <!-- ============================================
         STUDIO
    ============================================= -->

    <div
        class="card"
        id="card-studio">

        <img
            src="logos/Tymove logo B.png"
            alt="Umbrella Corporation Ostrava">

        <div id="studio-name">

            Umbrella Corporation Ostrava z.s.

        </div>

        <div id="studio-sub">

            presents

        </div>

    </div>


    <!-- ============================================
         SPONSORS
    ============================================= -->

    <div
        class="card"
        id="card-sponsors">

        <div id="sponsor-label">

            Sponsored by

        </div>


        <div id="sponsor-grid">

            <img
                src="logos/Sponzor 2 W.png"
                alt="Anareus">

            <img
                src="logos/EPES - VYSOKE LOGO - BILE.png"
                alt="Epes">

            <img
                src="logos/Fallens_Airsoft_OnlyText_3000x3000.png"
                alt="Fallens">

            <img
                src="logos/Cygnus Logo White - No__ Backround.png"
                alt="Cygnus Armory">

            <img
                src="logos/Sponzor 3.png"
                alt="Begadi">

        </div>

    </div>


    <!-- ============================================
         TITLE
    ============================================= -->

    <div
        class="card"
        id="card-title">

        <div id="title-wrap">

            <div id="title">

                AIRSOFT<br>

                <span>MAPS</span>

            </div>

            <div id="tagline">

                Vyber. Boj. Přežij.

            </div>

        </div>

    </div>


    <div id="continue-hint">

        Klikni pro pokračování

    </div>


    <button id="skip-btn">

        Přeskočit

    </button>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const stage =
    document.getElementById("stage");

const studio =
    document.getElementById("card-studio");

const sponsors =
    document.getElementById("card-sponsors");

const title =
    document.getElementById("card-title");

const flash =
    document.getElementById("flash");

const hint =
    document.getElementById("continue-hint");

const skip =
    document.getElementById("skip-btn");


/* =====================================================
   STATE
===================================================== */

let currentStep = 0;

let finished = false;

let autoTimer = null;


/* =====================================================
   FINISH
===================================================== */

function finishIntro(){

    if(finished) return;

    finished = true;

    window.location.href =
        "menu.html";
}


/* =====================================================
   FLASH
===================================================== */

function doFlash(){

    flash.classList.remove("sweep");

    void flash.offsetWidth;

    flash.classList.add("sweep");
}


/* =====================================================
   SHOW STEP
===================================================== */

function showStep(step){

    if(finished) return;


    studio.classList.remove("show");
    sponsors.classList.remove("show");
    title.classList.remove("show");

    hint.classList.remove("show");


    doFlash();


    setTimeout(() => {

        if(finished) return;


        if(step === 0){

            studio.classList.add("show");

        }

        if(step === 1){

            sponsors.classList.add("show");

        }

        if(step === 2){

            title.classList.add("show");

            setTimeout(() => {

                if(!finished){

                    hint.classList.add("show");

                }

            },500);

        }

    },300);

}


/* =====================================================
   NEXT
===================================================== */

function nextStep(){

    if(finished) return;


    clearTimeout(autoTimer);


    if(currentStep < 2){

        currentStep++;

        showStep(currentStep);

        scheduleAuto();

    }else{

        finishIntro();

    }

}


/* =====================================================
   AUTO
===================================================== */

function scheduleAuto(){

    clearTimeout(autoTimer);


    autoTimer = setTimeout(() => {

        if(currentStep < 2){

            currentStep++;

            showStep(currentStep);

            scheduleAuto();

        }

    },5000);

}


/* =====================================================
   CLICK
===================================================== */

document.addEventListener(
    "click",
    event => {

        if(event.target === skip){

            finishIntro();

            return;
        }

        nextStep();

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape" ||
            event.key === " " ||
            event.key === "Enter"
        ){

            nextStep();

        }

    }
);


/* =====================================================
   SKIP BUTTON
===================================================== */

setTimeout(() => {

    skip.classList.add("visible");

},800);


/* =====================================================
   START
===================================================== */

requestAnimationFrame(() => {

    stage.classList.add("bars-in");

});


setTimeout(() => {

    showStep(0);

    scheduleAuto();

},500);

</script>

</body>

</html>
