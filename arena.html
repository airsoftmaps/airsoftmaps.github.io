<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRSOFT MAPS — Aréna s patry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* Drobné vizuální úpravy pro tlačítka pater */
  .am-floor-toggle {
    display: flex;
    gap: 4px;
    margin-left: 15px;
    background: var(--bg-panel, #1c1f24);
    padding: 4px;
    border-radius: 8px;
    border: 1px solid var(--border-color, #2f333a);
  }
  .am-floor-toggle button {
    background: transparent;
    border: none;
    color: var(--text-dim, #8b949e);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .am-floor-toggle button.active {
    background: var(--accent, #ff7a1a);
    color: #fff;
  }
</style>
</head>
<body>

<header class="am-header">
  <a class="am-brand" href="menu.html">
    <img class="am-brand-logo" src="loga/tmavekulate.png" alt="Airsoft Maps">
  </a>

  <div class="am-field-title">CQB — <span>ARÉNA (2 PATRA)</span></div>

  <div class="am-controls">
    <button class="am-btn" id="back-btn">← <span id="back-label">Zpět na hřiště</span></button>
    <div class="am-dd" id="lang-dd">
      <button class="am-btn">🌐 <span id="lang-current">CZ</span></button>
      <div class="am-dd-menu">
        <button data-lang="cs">Čeština</button>
        <button data-lang="en">English</button>
      </div>
    </div>
  </div>
</header>

<div class="am-map-toolbar">
  <div class="am-toggle">
    <button id="btn-2d" class="active">2D</button>
    <button id="btn-3d">3D</button>
  </div>
  
  <div class="am-floor-toggle">
    <button id="btn-f1" class="active">1. Patro</button>
    <button id="btn-f2">2. Patro</button>
  </div>
</div>

<div class="am-map-body">
  <div class="am-map-canvas">
    <svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="am-sidebar">
    <div class="am-sidebar-title" id="sidebar-title">Místa na hřišti</div>
    <div id="poi-list"></div>
  </div>
</div>

<script src="common.js"></script>
<!-- Skript geo.js byl odstraněn -->
<script src="map-engine.js"></script>
<script>
  /* ====================================================================
     DATA 1. PATRA (1p.png)
     ==================================================================== */
  const FIELD_DATA_1P = {
    viewBoxFlat: "0 0 1400 1400",
    
    // Hranice objektu
    boundary: [
      [1, 3], [9, 3], [9, 1], [13, 1], [13, 13], [4, 13], [4, 10], [1, 10], [1, 3]
    ],

    // Oranžová šipka vstup
    entrance: { col: 0.5, row: 9.2, angle: 0 },

    roads: [],
    trees: [],

    // Černé čáry (zdi)
    walls: [
      // Obvodové
      { rect: [1, 3, 9, 3.2] },
      { rect: [9, 1, 9.2, 3] },
      { rect: [9, 1, 13, 1.2] },
      { rect: [12.8, 1, 13, 13] },
      { rect: [4, 12.8, 13, 13] },
      { rect: [4, 10, 4.2, 13] },
      { rect: [1, 10, 4, 10.2] },
      { rect: [1, 3, 1.2, 8.5] },
      { rect: [1, 9.5, 1.2, 10] },

      // Vnitřní zdi
      { rect: [4.5, 3, 4.7, 8.5] },
      { rect: [4.5, 8.5, 8, 8.7] },
      { rect: [8, 3, 8.2, 6] },
      { rect: [8, 7, 8.2, 8.7] },
      { rect: [4.5, 6, 8, 6.2] }, 
      { rect: [10.5, 3, 10.7, 8] },
      { rect: [10.5, 3, 13, 3.2] },
      { rect: [10.5, 8, 13, 8.2] },
      { rect: [8, 10, 13, 10.2] },
      { rect: [8, 10, 8.2, 13] },
      { rect: [9.5, 11, 13, 11.2] },
      { rect: [9.5, 10, 9.7, 11] },
      
      // Ohraničení modrého shromaždiště - barevná zeď (modrá)
      { rect: [1.2, 3.2, 4.5, 3.4], color: "#1e3a8a", height: 0.2 },
      { rect: [1.2, 8.3, 4.5, 8.5], color: "#1e3a8a", height: 0.2 },
      { rect: [4.3, 3.2, 4.5, 8.5], color: "#1e3a8a", height: 0.2 }
    ],

    buildings: [
      { id: "safe", code: "SAFE", name: "Shromaždiště", nameEn: "Safe Zone", rect: [1.5, 3.5, 4.2, 8.2], height: 0.1 },
      { id: "st1_up", code: "SCHODY", name: "Schody nahoru", nameEn: "Stairs UP", rect: [10, 2, 12, 3], height: 0.5 },
      { id: "st2_up", code: "SCHODY", name: "Schody nahoru", nameEn: "Stairs UP", rect: [8.5, 11.5, 10.5, 12.5], height: 0.5 }
    ]
  };

  /* ====================================================================
     DATA 2. PATRA (2p.png)
     ==================================================================== */
  const FIELD_DATA_2P = {
    viewBoxFlat: "0 0 1400 1400",
    
    boundary: [
      [1, 1], [13, 1], [13, 9], [9, 9], [9, 13], [1, 13], [1, 1]
    ],

    entrance: null, // Ve 2. patře není hlavní vchod z venku
    roads: [],
    trees: [],

    walls: [
      // Obvodové
      { rect: [1, 1, 13, 1.2] },
      { rect: [12.8, 1, 13, 9] },
      { rect: [9, 8.8, 13, 9] },
      { rect: [8.8, 9, 9, 13] },
      { rect: [1, 12.8, 9, 13] },
      { rect: [1, 1, 1.2, 13] },

      // Vnitřní zdi
      { rect: [4.5, 1, 4.7, 5] },
      { rect: [4.5, 6, 4.7, 13] },
      { rect: [1, 5, 4.5, 5.2] },
      { rect: [1, 8, 4.5, 8.2] },
      { rect: [4.5, 8, 9, 8.2] },
      { rect: [6.5, 1, 6.7, 4] },
      { rect: [6.5, 5, 6.7, 8] },
      { rect: [8.5, 1, 8.7, 8] },
      { rect: [4.5, 4, 8.5, 4.2] },
      { rect: [10.5, 1, 10.7, 9] },
      { rect: [10.5, 5, 13, 5.2] },
      { rect: [10.5, 7, 13, 7.2] }
    ],

    buildings: [
      { id: "st1_dn", code: "SCHODY", name: "Schody dolů", nameEn: "Stairs DOWN", rect: [11, 1.2, 12, 2], height: 0.1 },
      { id: "st2_dn", code: "SCHODY", name: "Schody dolů", nameEn: "Stairs DOWN", rect: [9, 10.5, 11, 12.5], height: 0.1 }
    ]
  };

  /* ====================================================================
     INICIALIZACE A PŘEPÍNÁNÍ
     ==================================================================== */
  
  // Výchozí data jsou 1. patro
  let currentData = JSON.parse(JSON.stringify(FIELD_DATA_1P));

  const svg = document.getElementById("map-svg");
  const listEl = document.getElementById("poi-list");

  const LABELS = {
    cs: { back:"Zpět na hřiště", sidebar:"Místa na hřišti" },
    en: { back:"Back to fields", sidebar:"Points of interest" }
  };

  function applyStaticText(lang) {
    document.getElementById("back-label").textContent = LABELS[lang].back;
    document.getElementById("sidebar-title").textContent = LABELS[lang].sidebar;
  }

  // Funkce ze standardní knihovny AirsoftMaps (pokud existují)
  if (typeof AM !== 'undefined') {
      AM.wireDropdowns();
      applyStaticText(AM.getLang());
      AM.wireLangSwitch((lang) => {
        applyStaticText(lang);
        engine.redraw();
      });
  } else {
      applyStaticText('cs'); // Fallback
  }

  document.getElementById("back-btn").addEventListener("click", () => {
    window.location.href = "menu.html";
  });

  // Inicializace MapEngine
  const engine = MapEngine.init({
    svg,
    listEl,
    data: currentData,
    getLang: () => (typeof AM !== 'undefined' ? AM.getLang() : 'cs'),
    mountModeToggle: {
      btn2d: document.getElementById("btn-2d"),
      btn3d: document.getElementById("btn-3d")
    }
  });

  // Obsluha přepínání pater
  const btnF1 = document.getElementById('btn-f1');
  const btnF2 = document.getElementById('btn-f2');

  btnF1.addEventListener('click', () => {
    btnF1.classList.add('active');
    btnF2.classList.remove('active');
    
    // Přepis dat do aktuálního objektu, na který je engine napojený
    Object.keys(currentData).forEach(key => delete currentData[key]);
    Object.assign(currentData, JSON.parse(JSON.stringify(FIELD_DATA_1P)));
    
    engine.redraw();
  });

  btnF2.addEventListener('click', () => {
    btnF2.classList.add('active');
    btnF1.classList.remove('active');
    
    Object.keys(currentData).forEach(key => delete currentData[key]);
    Object.assign(currentData, JSON.parse(JSON.stringify(FIELD_DATA_2P)));
    
    engine.redraw();
  });

</script>
</body>
</html>
