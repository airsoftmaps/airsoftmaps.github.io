<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRSOFT MAPS — Jablonné</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>

<header class="am-header">
  <a class="am-brand" href="menu.html">
    <img class="am-brand-logo" src="loga/tmavekulate.png" alt="Airsoft Maps">
  </a>

  <div class="am-field-title">AIRSOFT PARK — <span>JABLONNÉ</span></div>

  <div class="am-controls">
    <button class="am-btn" id="back-btn">← <span id="back-label">Zpět na hřiště</span></button>
    <div class="am-dd" id="lang-dd">
      <button class="am-btn">🌐 <span id="lang-current">CZ</span></button>
      <div class="am-dd-menu">
        <button data-lang="cs">Čeština</button>
        <button data-lang="en">English</button>
      </div>
    </div>
  </div>
</header>

<div class="am-map-toolbar">
  <div class="am-toggle">
    <button id="btn-2d" class="active">2D</button>
    <button id="btn-3d">3D</button>
    <button class="am-locate-btn" id="locate-btn" style="margin-left:10px;">
      <span class="dot"></span><span id="locate-label">Moje poloha</span>
    </button>
  </div>
</div>
<div class="am-locate-status" id="locate-status"></div>

<div class="am-map-body">
  <div class="am-map-canvas">
    <svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="am-sidebar">
    <div class="am-sidebar-title" id="sidebar-title">Místa na hřišti</div>
    <div id="poi-list"></div>
  </div>
</div>

<script src="common.js?v=3"></script>
<script src="geo.js?v=3"></script>
<script src="map-engine.js?v=7"></script>
<script>
  /* ====================================================================

     Hranice, zdi a "místa" vytažené z pixelů podkladu (jablgrid.png),
     měřítko 94.7 px = 1 grid jednotka, počátek (0,0) = levý horní
     roh obrázku.
     GPS kotvy zatím nejsou — doplní se později (tlačítko "Moje poloha"
     se zatím samo schová, dokud geoAnchors nebudou vyplněné).
     "Místa" (světle/tmavě modrá na plánku) jsou v datech obyčejné
     "buildings" s vlastní barvou (color) a nízkou výškou — fungují
     jako běžné POI (klik, zvýraznění, seznam dole), jen vizuálně
     nevypadají jako klasická budova.
     ==================================================================== */

  const FIELD_DATA = {
    viewBoxFlat: "0 0 650 700",

    geoAnchors: [
      // TODO: doplnit 3 reálné GPS body — { col, row, lat, lng }
    ],

      [0.095, 2.524],
      [0.169, 2.893],

    ],

    entrance: null,
    roads: [],
    trees: [],

    // Zdi — vytažené z černých linek v podkladu (vč. hrubé aproximace
    // klikatého "cik-cak" prvku u severního vstupu do vnitřní plochy —
    // ten je ve skutečnosti šikmý, tady zjednodušený na pár rovných
    // úseků; pokud chceš přesný lomený tvar, řekni, dodělám do enginu
    // podporu pro víc-bodové zdi)
    walls: [
      { rect: [5.238, 2.524, 5.502, 2.534] },
      { rect: [4.52, 2.577, 4.931, 2.587] },
      { rect: [4.562, 2.64, 4.699, 2.65] },
      { rect: [5.005, 2.841, 5.079, 2.851] },
      { rect: [5.016, 3.083, 5.185, 3.094] },
      { rect: [5.29, 3.136, 5.438, 3.147] },
      { rect: [4.731, 3.2, 4.826, 3.21] },
      { rect: [4.002, 3.485, 4.108, 3.495] },
      { rect: [4.002, 3.611, 4.129, 3.622] },
      { rect: [5.523, 3.664, 5.734, 3.675] },
      { rect: [4.572, 3.696, 4.688, 3.706] },
      { rect: [5.829, 3.728, 5.924, 3.738] },
      { rect: [4.741, 3.738, 4.868, 3.749] },
      { rect: [4.446, 3.833, 4.541, 3.844] },
      { rect: [5.216, 3.854, 5.375, 3.865] },
      { rect: [5.523, 3.875, 5.734, 3.886] },
      { rect: [4.002, 3.949, 4.097, 3.96] },
      { rect: [4.583, 4.488, 4.868, 4.498] },
      { rect: [3.58, 4.593, 3.759, 4.604] },
      { rect: [3.58, 4.731, 3.759, 4.741] },
      { rect: [3.305, 3.242, 3.326, 3.39] },
      { rect: [3.58, 4.604, 3.59, 4.752] },
      { rect: [3.738, 4.593, 3.749, 4.752] },
      { rect: [3.96, 3.252, 3.97, 3.421] },
      { rect: [4.424, 3.358, 4.435, 3.569] },
      { rect: [4.52, 2.577, 4.53, 2.978] },
      { rect: [4.52, 3.01, 4.53, 3.981] },
      { rect: [4.583, 4.498, 4.593, 4.593] },
      { rect: [4.678, 2.64, 4.688, 2.978] },
      { rect: [4.678, 3.01, 4.688, 3.083] },
      { rect: [4.731, 3.115, 4.741, 3.485] },
      { rect: [4.847, 4.488, 4.857, 4.583] },
      { rect: [4.91, 2.577, 4.921, 2.978] },
      { rect: [4.91, 3.01, 4.921, 3.981] },
      { rect: [5.079, 3.537, 5.121, 3.664] },
      { rect: [5.153, 2.175, 5.164, 2.334] },
      { rect: [5.216, 3.854, 5.227, 3.981] },
      { rect: [5.269, 3.01, 5.28, 3.094] },
      { rect: [5.364, 3.854, 5.375, 3.981] },
      { rect: [5.523, 3.664, 5.533, 3.897] },
      { rect: [5.713, 3.664, 5.723, 3.897] },
      { rect: [5.913, 3.854, 5.924, 3.981] },
      { rect: [4.615, 1.489, 4.773, 1.605] },
      { rect: [4.773, 1.605, 4.889, 1.774] },
      { rect: [4.805, 1.774, 5.005, 2.006] },
    ],

    // Jediná skutečná budova (plný černý čtverec v podkladu)
    buildings: [
      { id:"budova1", code:"B1", name:"Budova 1", nameEn:"Building 1", rect:[3.812, 3.654, 3.981, 3.791], height:0.8 },

      // "Místa" — barevné, nízké, bez vzhledu budovy, ale plně
      // klikací a v seznamu dole. Názvy/kódy zatím obecné — přejmenuj
      // podle potřeby.
      { id:"misto_a", code:"A", name:"Místo A", nameEn:"Place A", rect:[4.234, 0.296, 4.857, 0.612], color:"#0064ff", height:0.2 },
      { id:"misto_b", code:"B", name:"Místo B", nameEn:"Place B", rect:[4.572, 2.059, 4.984, 2.291], color:"#0064ff", height:0.2 },
      { id:"misto_c", code:"C", name:"Místo C", nameEn:"Place C", rect:[4.71, 2.619, 4.91, 3.105], color:"#0064ff", height:0.2 },
      { id:"misto_d", code:"D", name:"Místo D", nameEn:"Place D", rect:[6.008, 2.914, 6.272, 3.263], color:"#0064ff", height:0.2 },
      { id:"misto_e", code:"E", name:"Místo E", nameEn:"Place E", rect:[4.023, 3.115, 4.382, 3.442], color:"#0064ff", height:0.2 },
      { id:"misto_f", code:"F", name:"Místo F", nameEn:"Place F", rect:[5.185, 3.273, 5.639, 3.611], color:"#0064ff", height:0.2 },
      { id:"misto_g", code:"G", name:"Místo G", nameEn:"Place G", rect:[3.77, 4.372, 4.118, 4.857], color:"#0064ff", height:0.2 },
      { id:"misto_h", code:"H", name:"Místo H", nameEn:"Place H", rect:[3.284, 6.241, 5.005, 6.748], color:"#00f7ff", height:0.2 },
      { id:"misto_i", code:"I", name:"Místo I", nameEn:"Place I", rect:[5.005, 6.241, 5.85, 6.748], color:"#0064ff", height:0.2 }
    ]
  };

  const svg = document.getElementById("map-svg");
  const listEl = document.getElementById("poi-list");

  const LABELS = {
    cs: { back:"Zpět na hřiště", sidebar:"Místa na hřišti" },
    en: { back:"Back to fields", sidebar:"Points of interest" }
  };

  function applyStaticText(lang) {
    document.getElementById("back-label").textContent = LABELS[lang].back;
    document.getElementById("sidebar-title").textContent = LABELS[lang].sidebar;
  }

AM.wireDropdowns();

applyStaticText(AM.getLang());

document.getElementById("back-btn").addEventListener("click", () => {
  window.location.href = "menu.html";
});

const engine = MapEngine.init({
  svg,
  listEl,
  data: FIELD_DATA,
  getLang: AM.getLang,
  mountModeToggle: {
    btn2d: document.getElementById("btn-2d"),
    btn3d: document.getElementById("btn-3d")
  }
});

AM.wireLangSwitch((lang) => {
  applyStaticText(lang);
  engine.redraw();
});
  const LOCATE_TEXT = {
    cs: { btn:"Moje poloha", on:"Sleduji polohu", outside:"Jsi mimo hřiště",
          denied:"Poloha zamítnuta v prohlížeči", unavailable:"Polohu se nepodařilo zjistit",
          noAnchors:"Pro toto hřiště není poloha dostupná" },
    en: { btn:"My location", on:"Tracking location", outside:"You are outside the field",
          denied:"Location permission denied", unavailable:"Could not get location",
          noAnchors:"Location isn't available for this field" }
  };

  const locateBtn = document.getElementById("locate-btn");
  const locateLabel = document.getElementById("locate-label");
  const locateStatus = document.getElementById("locate-status");
  let watchId = null, tracking = false;
  let stopHeading = null, lastHeading = null, lastUpBearing = null, insideField = false;

  const hasGeo = FIELD_DATA.geoAnchors && FIELD_DATA.geoAnchors.length >= 3
    && FIELD_DATA.geoAnchors.every(a => a.lat && a.lng);

  function applyCompassRotation() {
    if (insideField && lastHeading != null && lastUpBearing != null) {
      engine.setCompassRotation((lastUpBearing - lastHeading + 360) % 360);
    } else {
      engine.setCompassRotation(null);
    }
  }

  if (!hasGeo) {
    locateBtn.style.display = "none";
  } else {
    locateBtn.addEventListener("click", () => {
      const lang = AM.getLang();
      if (tracking) {
        AMGeo.stop(watchId); watchId = null; tracking = false;
        if (stopHeading) { stopHeading(); stopHeading = null; }
        insideField = false;
        lastHeading = null;
        applyCompassRotation();
        locateBtn.classList.remove("active", "outside");
        locateLabel.textContent = LOCATE_TEXT[lang].btn;
        locateStatus.textContent = "";
        engine.setPlayer(null);
        return;
      }
      tracking = true;
      locateBtn.classList.add("active");
      locateLabel.textContent = LOCATE_TEXT[lang].on;

      stopHeading = AMGeo.watchHeading((heading) => {
        lastHeading = heading;
        applyCompassRotation();
      });

      watchId = AMGeo.watch(FIELD_DATA, (result) => {
        const t = LOCATE_TEXT[AM.getLang()];
        if (!result.ok) {
          locateStatus.textContent = t[result.reason] || t.unavailable;
          locateBtn.classList.remove("outside");
          engine.setPlayer(null);
          insideField = false;
          applyCompassRotation();
          return;
        }
        lastUpBearing = result.upBearing;
        if (result.inside) {
          locateBtn.classList.remove("outside");
          locateStatus.textContent = "";
          engine.setPlayer({ col: result.col, row: result.row });
          insideField = true;
        } else {
          locateBtn.classList.add("outside");
          locateStatus.textContent = t.outside;
          engine.setPlayer(null);
          insideField = false;
        }
        applyCompassRotation();
      });
    });
  }
</script>

</body>
</html>
