<script>

  const FIELD_DATA = {
    // Plocha je namapována na mřížku 15 (A-M + okraje) x 22 (1-20 + okraje)
    viewBoxFlat: "0 0 1500 2200",

    // GPS kotvy přesně podle požadavku (A=1.5, M=13.5; 1=1.5, 20=20.5)
    // Map Engine z tohoto sám určí správný upBearing pro kompas!
    geoAnchors: [
      { col: 1.5, row: 20.5, lat: 49.531258, lng: 17.316362 }, // A20
      { col: 1.5, row: 1.5, lat: 49.531988, lng: 17.318322 },  // A1
      { col: 13.5, row: 13.5, lat: 49.530620, lng: 17.317774 } // M13
    ],

    boundary: [
      [1, 1], [9, 1], [9, 5], [14, 11], [14, 15], 
      [5, 20], [3, 20], [3, 21], [1, 21], [1, 1]
    ],

    entrance: { col: 1.5, row: 1.5, angle: 90 },

    roads: [
      // Hlavní levý tah a horní smyčka
      { points: [[1.5, 20.5], [1.5, 13], [2.2, 7], [2.5, 2.5], [7.5, 2.5], [7.5, 12.5], [6.8, 14.5]] },
      // Spojky mezi budovami
      { points: [[1.5, 13], [7.5, 12.5]] },
      { points: [[1.5, 17], [6.8, 14.5]] },
      // Pravá větev k budově
      { points: [[7.5, 12.5], [11, 12.2]] },
      // Smyčka kolem pravé budovy
      { points: [[11, 12.2], [13, 12.2], [13, 13.5], [11, 13.5], [11, 12.2]] },
      // Malá odbočka vlevo nahoře
      { points: [[1.8, 6.5], [3.0, 6.5]] },
      // Spodní zelený blok (A20)
      { points: [[1.5, 20.5], [2.5, 20.5], [2.5, 19.5], [1.5, 19.5], [1.5, 20.5]] }
    ],

    trees: [], // Zatím bez stromů

    buildings: [
      // 3 hlavní velké haly nahoře
      { id:"b1", code:"OBJ-1", name:"Objekt 1", nameEn:"Building 1", rect:[3, 3, 7, 5], height:1.0 },
      { id:"b2", code:"OBJ-2", name:"Objekt 2", nameEn:"Building 2", rect:[3, 6, 7, 8], height:1.0 },
      { id:"b3", code:"OBJ-3", name:"Objekt 3", nameEn:"Building 3", rect:[3, 9, 7, 11], height:1.0 },
      
      // Spojovací moduly a přístavky (mezi velkými halami)
      { id:"b4", code:"OBJ-4", name:"Objekt 4", nameEn:"Building 4", rect:[3.2, 5, 3.8, 6], height:0.5 },
      { id:"b5", code:"OBJ-5", name:"Objekt 5", nameEn:"Building 5", rect:[5.2, 8, 5.8, 9], height:0.5 },
      { id:"b6", code:"OBJ-6", name:"Objekt 6", nameEn:"Building 6", rect:[2.7, 8.2, 3.2, 8.8], height:0.5 },
      { id:"b7", code:"OBJ-7", name:"Objekt 7", nameEn:"Building 7", rect:[3.2, 8, 3.8, 9], height:0.5 },
      { id:"b8", code:"OBJ-8", name:"Objekt 8", nameEn:"Building 8", rect:[3.5, 7.7, 4.1, 8], height:0.5 },
      
      // Přístavky pod třetí halou
      { id:"b9", code:"OBJ-9", name:"Objekt 9", nameEn:"Building 9", rect:[4.4, 11, 4.6, 12], height:0.5 },
      { id:"b10", code:"OBJ-10", name:"Objekt 10", nameEn:"Building 10", rect:[4, 11.8, 5, 13.2], height:0.8 },
      { id:"b11", code:"OBJ-11", name:"Objekt 11", nameEn:"Building 11", rect:[6.6, 10.2, 6.9, 10.8], height:0.5 },
      
      // Kruhová stavba a malé objekty vpravo
      { id:"b12", code:"OBJ-12", name:"Objekt 12", nameEn:"Building 12", rect:[7.4, 9.4, 9.2, 11.2], height:1.2 },

      { id:"b15", code:"OBJ-15", name:"Objekt 15", nameEn:"Building 15", rect:[2.2, 16.5, 3.5, 17.5], height:0.8 },
      { id:"b16", code:"OBJ-16", name:"Objekt 16", nameEn:"Building 16", rect:[3.0, 16.0, 4.5, 17.0], height:0.8 },
      { id:"b17", code:"OBJ-17", name:"Objekt 17", nameEn:"Building 17", rect:[4.0, 15.5, 5.5, 16.5], height:0.8 },
      { id:"b18", code:"OBJ-18", name:"Objekt 18", nameEn:"Building 18", rect:[5.0, 15.0, 6.5, 16.0], height:0.8 },
      { id:"b19", code:"OBJ-19", name:"Objekt 19", nameEn:"Building 19", rect:[6.0, 14.5, 7.0, 15.5], height:0.8 },
      
      // Malá šikmá budova vedle
      { id:"b20", code:"OBJ-20", name:"Objekt 20", nameEn:"Building 20", rect:[7.4, 14.2, 8.2, 15.2], height:0.8 },
      
      // Budova vpravo dole ve smyčce
      { id:"b21", code:"OBJ-21", name:"Objekt 21", nameEn:"Building 21", rect:[11.2, 12.2, 12.8, 13.2], height:0.8 }
    ]
  };

  const svg = document.getElementById("map-svg");
  const listEl = document.getElementById("poi-list");

  const LABELS = {
    cs: { back:"Zpět na hřiště", sidebar:"Místa na hřišti" },
    en: { back:"Back to fields", sidebar:"Points of interest" }
  };

  function applyStaticText(lang) {
    document.getElementById("back-label").textContent = LABELS[lang].back;
    document.getElementById("sidebar-title").textContent = LABELS[lang].sidebar;
  }

  AM.wireDropdowns();
  applyStaticText(AM.getLang());

  document.getElementById("back-btn").addEventListener("click", () => {
    window.location.href = "menu.html";
  });

  const engine = MapEngine.init({
    svg,
    listEl,
    data: FIELD_DATA,
    getLang: AM.getLang,
    mountModeToggle: {
      btn2d: document.getElementById("btn-2d"),
      btn3d: document.getElementById("btn-3d")
    }
  });

  AM.wireLangSwitch((lang) => {
    applyStaticText(lang);
    engine.redraw();
  });
  
  const LOCATE_TEXT = {
    cs: { btn:"Moje poloha", on:"Sleduji polohu", outside:"Jsi mimo hřiště",
          denied:"Poloha zamítnuta v prohlížeči", unavailable:"Polohu se nepodařilo zjistit",
          noAnchors:"Pro toto hřiště není poloha dostupná" },
    en: { btn:"My location", on:"Tracking location", outside:"You are outside the field",
          denied:"Location permission denied", unavailable:"Could not get location",
          noAnchors:"Location isn't available for this field" }
  };

  const locateBtn = document.getElementById("locate-btn");
  const locateLabel = document.getElementById("locate-label");
  const locateStatus = document.getElementById("locate-status");
  let watchId = null, tracking = false;
  let stopHeading = null, lastHeading = null, lastUpBearing = null, insideField = false;

  const hasGeo = FIELD_DATA.geoAnchors && FIELD_DATA.geoAnchors.length >= 3
    && FIELD_DATA.geoAnchors.every(a => a.lat && a.lng);

  function applyCompassRotation() {
    if (insideField && lastHeading != null && lastUpBearing != null) {
      engine.setCompassRotation((lastUpBearing - lastHeading + 360) % 360);
    } else {
      engine.setCompassRotation(null);
    }
  }

  if (!hasGeo) {
    locateBtn.style.display = "none";
  } else {
    locateBtn.addEventListener("click", () => {
      const lang = AM.getLang();
      if (tracking) {
        AMGeo.stop(watchId); watchId = null; tracking = false;
        if (stopHeading) { stopHeading(); stopHeading = null; }
        insideField = false;
        lastHeading = null;
        applyCompassRotation();
        locateBtn.classList.remove("active", "outside");
        locateLabel.textContent = LOCATE_TEXT[lang].btn;
        locateStatus.textContent = "";
        engine.setPlayer(null);
        return;
      }
      tracking = true;
      locateBtn.classList.add("active");
      locateLabel.textContent = LOCATE_TEXT[lang].on;

      stopHeading = AMGeo.watchHeading((heading) => {
        lastHeading = heading;
        applyCompassRotation();
      });

      watchId = AMGeo.watch(FIELD_DATA, (result) => {
        const t = LOCATE_TEXT[AM.getLang()];
        if (!result.ok) {
          locateStatus.textContent = t[result.reason] || t.unavailable;
          locateBtn.classList.remove("outside");
          engine.setPlayer(null);
          insideField = false;
          applyCompassRotation();
          return;
        }
        lastUpBearing = result.upBearing;
        if (result.inside) {
          locateBtn.classList.remove("outside");
          locateStatus.textContent = "";
          engine.setPlayer({ col: result.col, row: result.row });
          insideField = true;
        } else {
          locateBtn.classList.add("outside");
          locateStatus.textContent = t.outside;
          engine.setPlayer(null);
          insideField = false;
        }
        applyCompassRotation();
      });
    });
  }
</script>
