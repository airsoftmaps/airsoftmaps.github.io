/* ====================================================================
   MAP ENGINE
   ==================================================================== */

const svg = document.getElementById("map-svg");
const listEl = document.getElementById("poi-list");


/* ====================================================================
   STATIC TEXT
   ==================================================================== */

const LABELS = {

  cs: {
    back: "Zpět na hřiště",
    sidebar: "Místa na hřišti"
  },

  en: {
    back: "Back to fields",
    sidebar: "Points of interest"
  }

};


function applyStaticText(lang) {

  document.getElementById("back-label").textContent =
    LABELS[lang].back;

  document.getElementById("sidebar-title").textContent =
    LABELS[lang].sidebar;

}


/* ====================================================================
   MENU
   ==================================================================== */

AM.wireDropdowns();

applyStaticText(AM.getLang());


document
  .getElementById("back-btn")
  .addEventListener("click", () => {

    window.location.href = "menu.html";

  });


/* ====================================================================
   ENGINE
   ==================================================================== */

const engine = MapEngine.init({

  svg,

  listEl,

  data: FIELD_DATA,

  getLang: AM.getLang,

  mountModeToggle: {

    btn2d: document.getElementById("btn-2d"),

    btn3d: document.getElementById("btn-3d")

  }

});


/* ====================================================================
   LANGUAGE SWITCH
   ==================================================================== */

AM.wireLangSwitch((lang) => {

  applyStaticText(lang);

  engine.redraw();

});


/* ====================================================================
   GPS / COMPASS
   ==================================================================== */

const LOCATE_TEXT = {

  cs: {

    btn: "Moje poloha",

    on: "Sleduji polohu",

    outside: "Jsi mimo hřiště",

    denied: "Poloha zamítnuta v prohlížeči",

    unavailable: "Polohu se nepodařilo zjistit",

    noAnchors: "Pro toto hřiště není poloha dostupná"

  },

  en: {

    btn: "My location",

    on: "Tracking location",

    outside: "You are outside the field",

    denied: "Location permission denied",

    unavailable: "Could not get location",

    noAnchors: "Location isn't available for this field"

  }

};


const locateBtn =
  document.getElementById("locate-btn");

const locateLabel =
  document.getElementById("locate-label");

const locateStatus =
  document.getElementById("locate-status");


let watchId = null;

let tracking = false;

let stopHeading = null;

let lastHeading = null;

let lastUpBearing = null;

let insideField = false;


/* ====================================================================
   GPS KONTROLA
   ==================================================================== */

const hasGeo =

  FIELD_DATA.geoAnchors &&

  FIELD_DATA.geoAnchors.length >= 3 &&

  FIELD_DATA.geoAnchors.every(
    a => a.lat && a.lng
  );


/* ====================================================================
   KOMPAS
   ==================================================================== */

function applyCompassRotation() {

  if (
    insideField &&
    lastHeading != null &&
    lastUpBearing != null
  ) {

    engine.setCompassRotation(

      (lastUpBearing - lastHeading + 360) % 360

    );

  } else {

    engine.setCompassRotation(null);

  }

}


/* ====================================================================
   GEOLOCATION
   ==================================================================== */

if (!hasGeo) {

  locateBtn.style.display = "none";

} else {

  locateBtn.addEventListener("click", () => {

    const lang = AM.getLang();


    /* --------------------------------------------------------------
       VYPNOUT SLEDOVÁNÍ
       -------------------------------------------------------------- */

    if (tracking) {

      AMGeo.stop(watchId);

      watchId = null;

      tracking = false;


      if (stopHeading) {

        stopHeading();

        stopHeading = null;

      }


      insideField = false;

      lastHeading = null;

      applyCompassRotation();


      locateBtn.classList.remove(
        "active",
        "outside"
      );


      locateLabel.textContent =
        LOCATE_TEXT[lang].btn;


      locateStatus.textContent = "";


      engine.setPlayer(null);

      return;

    }


    /* --------------------------------------------------------------
       ZAPNOUT SLEDOVÁNÍ
       -------------------------------------------------------------- */

    tracking = true;


    locateBtn.classList.add("active");


    locateLabel.textContent =
      LOCATE_TEXT[lang].on;


    /* --------------------------------------------------------------
       KOMPAS
       -------------------------------------------------------------- */

    stopHeading = AMGeo.watchHeading(
      (heading) => {

        lastHeading = heading;

        applyCompassRotation();

      }
    );


    /* --------------------------------------------------------------
       GPS
       -------------------------------------------------------------- */

    watchId = AMGeo.watch(
      FIELD_DATA,

      (result) => {

        const t =
          LOCATE_TEXT[AM.getLang()];


        /* ----------------------------------------------------------
           CHYBA
           ---------------------------------------------------------- */

        if (!result.ok) {

          locateStatus.textContent =
            t[result.reason] ||
            t.unavailable;


          locateBtn.classList.remove(
            "outside"
          );


          engine.setPlayer(null);

          insideField = false;

          applyCompassRotation();

          return;

        }


        /* ----------------------------------------------------------
           ORIENTACE MAPY
           ---------------------------------------------------------- */

        lastUpBearing =
          result.upBearing;


        /* ----------------------------------------------------------
           UVNITŘ HŘIŠTĚ
           ---------------------------------------------------------- */

        if (result.inside) {

          locateBtn.classList.remove(
            "outside"
          );


          locateStatus.textContent = "";


          engine.setPlayer({

            col: result.col,

            row: result.row

          });


          insideField = true;

        }


        /* ----------------------------------------------------------
           MIMO HŘIŠTĚ
           ---------------------------------------------------------- */

        else {

          locateBtn.classList.add(
            "outside"
          );


          locateStatus.textContent =
            t.outside;


          engine.setPlayer(null);

          insideField = false;

        }


        applyCompassRotation();

      }
    );

  });

}
