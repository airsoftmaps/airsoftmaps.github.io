<!DOCTYPE html>
<html lang="cs">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AIRSOFT MAPS — Battlefield</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    background:#050608;

    color:#eef1f0;

    font-family:"Rajdhani",sans-serif;

    overflow:hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

body{

    background:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(255,122,26,.08),
            transparent 55%
        ),

        radial-gradient(
            ellipse at 50% 50%,
            #101317,
            #020304 85%
        );

    position:relative;
}

body::before{

    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    opacity:.18;

    background-image:

        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:
        40px 40px;

    z-index:1;
}

body::after{

    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    box-shadow:
        inset 0 0 120px rgba(0,0,0,.95);

    z-index:2;
}

/* =========================================================
   HEADER
========================================================= */

header{

    height:78px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 4vw;

    position:relative;

    z-index:10;

    border-bottom:
        1px solid rgba(255,255,255,.06);

    background:
        rgba(3,5,6,.82);

    backdrop-filter:
        blur(12px);
}

.back-btn,
.dd-btn{

    background:
        rgba(255,255,255,.025);

    border:
        1px solid #30353b;

    color:#c7ccd1;

    font-family:"Rajdhani",sans-serif;

    font-size:12px;

    letter-spacing:.12em;

    text-transform:uppercase;

    padding:
        9px 15px;

    cursor:pointer;

    transition:
        .2s ease;
}

.back-btn:hover,
.dd-btn:hover{

    border-color:#ff7a1a;

    color:#ff7a1a;

    background:
        rgba(255,122,26,.05);
}

.field-title{

    position:absolute;

    left:50%;

    transform:
        translateX(-50%);

    text-align:center;
}

.field-title small{

    display:block;

    color:#697078;

    font-size:9px;

    letter-spacing:.4em;

    margin-bottom:2px;
}

.field-title h1{

    font-family:"Anton",sans-serif;

    font-size:
        clamp(24px,3vw,38px);

    letter-spacing:.04em;
}

.field-title span{

    color:#ff7a1a;
}

.top-controls{

    display:flex;

    gap:8px;
}

.dd{

    position:relative;
}

.dd-menu{

    position:absolute;

    right:0;

    top:
        calc(100% + 6px);

    min-width:170px;

    background:#0b0e11;

    border:
        1px solid #30353b;

    box-shadow:
        0 15px 40px rgba(0,0,0,.7);

    display:none;

    z-index:50;
}

.dd.open .dd-menu{

    display:block;
}

.dd-menu button{

    width:100%;

    border:0;

    background:none;

    color:#bfc5ca;

    text-align:left;

    padding:
        11px 15px;

    font-family:"Rajdhani",sans-serif;

    cursor:pointer;
}

.dd-menu button:hover{

    background:
        rgba(255,122,26,.08);

    color:#ff7a1a;
}

/* =========================================================
   MAP CONTROLS
========================================================= */

.map-toolbar{

    height:64px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:14px;

    position:relative;

    z-index:10;
}

.mode-switch{

    display:flex;

    border:
        1px solid #30353b;

    background:
        rgba(0,0,0,.4);
}

.mode-switch button{

    border:0;

    background:none;

    color:#727980;

    font-family:"Rajdhani",sans-serif;

    font-size:11px;

    font-weight:600;

    letter-spacing:.15em;

    padding:
        9px 18px;

    cursor:pointer;

    transition:.2s;
}

.mode-switch button.active{

    background:#ff7a1a;

    color:#080a0b;
}

.view-switch{

    display:flex;

    border:
        1px solid #30353b;
}

.view-switch button{

    border:0;

    background:
        rgba(255,255,255,.025);

    color:#8a9198;

    font-family:"Rajdhani",sans-serif;

    padding:
        9px 15px;

    cursor:pointer;
}

.view-switch button.active{

    color:#111;

    background:#d8dde0;
}

/* =========================================================
   MAP
========================================================= */

.map-wrap{

    position:relative;

    z-index:5;

    margin:
        0 3vw 3vh;

    height:
        calc(100vh - 145px);

    border:
        1px solid #292e33;

    background:
        #111719;

    overflow:hidden;

    box-shadow:
        0 20px 80px rgba(0,0,0,.65);
}

.map-wrap::before{

    content:"TACTICAL OVERVIEW";

    position:absolute;

    left:18px;

    top:14px;

    z-index:20;

    font-size:9px;

    letter-spacing:.35em;

    color:#70777d;
}

.map-wrap::after{

    content:"TRIAGE // AIRSOFT MAP SYSTEM";

    position:absolute;

    right:18px;

    bottom:12px;

    z-index:20;

    font-size:8px;

    letter-spacing:.25em;

    color:#5d646a;
}

#map-container{

    width:100%;

    height:100%;
}

#map-container svg{

    width:100%;

    height:100%;

    display:block;

    transition:
        transform .6s cubic-bezier(.2,.9,.2,1);
}

/* =========================================================
   MAP GRAPHICS
========================================================= */

.terrain{

    fill:#18251d;
}

.terrain-light{

    fill:#213125;
}

.terrain-dark{

    fill:#101a15;
}

.field-boundary{

    fill:
        rgba(255,122,26,.025);

    stroke:
        #ff7a1a;

    stroke-width:
        2;

    stroke-dasharray:
        8 5;
}

.road{

    fill:none;

    stroke:#343b39;

    stroke-width:18;

    stroke-linecap:round;
}

.road-inner{

    fill:none;

    stroke:#1a201f;

    stroke-width:11;

    stroke-linecap:round;
}

.path{

    fill:none;

    stroke:#4b514c;

    stroke-width:5;

    stroke-dasharray:10 7;

    opacity:.65;
}

.building{

    fill:#30383a;

    stroke:#768083;

    stroke-width:2;
}

.building:hover{

    fill:#3c4749;

    stroke:#ff7a1a;

}

.building-roof{

    fill:#242b2d;

    stroke:#555e61;

    stroke-width:1;
}

.building-label{

    font-family:"Rajdhani",sans-serif;

    font-size:12px;

    font-weight:700;

    letter-spacing:.1em;

    fill:#dfe4e5;

    pointer-events:none;

}

.zone{

    fill:
        rgba(255,122,26,.08);

    stroke:
        rgba(255,122,26,.55);

    stroke-width:1.5;

    stroke-dasharray:6 4;
}

.spawn{

    fill:#121719;

    stroke:#55d6ff;

    stroke-width:2;
}

.spawn-text{

    fill:#55d6ff;

    font-size:9px;

    font-weight:700;

    letter-spacing:.15em;
}

.poi{

    fill:#ff7a1a;

}

.poi-text{

    fill:#ff9a55;

    font-size:9px;

    font-weight:700;

    letter-spacing:.1em;
}

.mode-objective{

    fill:
        rgba(255,255,255,.025);

    stroke:
        #737b80;

    stroke-width:1;

}

.mode-objective.active{

    fill:
        rgba(255,122,26,.12);

    stroke:
        #ff7a1a;
}

/* =========================================================
   MAP UI
========================================================= */

.map-info{

    position:absolute;

    left:18px;

    bottom:18px;

    z-index:30;

    width:250px;

    background:
        rgba(5,7,8,.88);

    border:
        1px solid #30363b;

    padding:15px;

    backdrop-filter:
        blur(8px);
}

.map-info-title{

    font-size:10px;

    color:#ff7a1a;

    letter-spacing:.25em;

    margin-bottom:6px;
}

.map-info-name{

    font-family:"Anton",sans-serif;

    font-size:25px;

    letter-spacing:.03em;
}

.map-info-text{

    margin-top:5px;

    color:#777f85;

    font-size:11px;

    line-height:1.35;
}

.legend{

    position:absolute;

    right:18px;

    bottom:18px;

    z-index:30;

    background:
        rgba(5,7,8,.88);

    border:
        1px solid #30363b;

    padding:12px 14px;

    font-size:10px;

    color:#899095;
}

.legend-row{

    display:flex;

    align-items:center;

    gap:8px;

    margin:5px 0;
}

.legend-dot{

    width:8px;

    height:8px;

    border-radius:50%;

    background:#ff7a1a;
}

.legend-dot.spawn{

    border-radius:0;

    background:#55d6ff;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    header{

        height:105px;

        padding:
            10px 4vw;

        align-items:flex-start;
    }

    .field-title{

        top:12px;
    }

    .top-controls{

        margin-top:48px;
    }

    .back-btn{

        margin-top:48px;
    }

    .map-toolbar{

        height:55px;
    }

    .map-wrap{

        margin:
            0 2vw 2vh;

        height:
            calc(100vh - 160px);
    }

    .map-info{

        width:180px;

        padding:10px;

        left:10px;

        bottom:10px;
    }

    .legend{

        right:10px;

        bottom:10px;

        padding:8px;
    }

    .map-info-text{

        display:none;
    }

}

</style>

</head>

/* =========================================================
   LOAD FIELD
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const fieldId =
    params.get("id") || "dalov";

const field =
    FIELDS[fieldId] || FIELDS.dalov;


document.getElementById(
    "field-name"
).textContent =
    field.name;


document.getElementById(
    "map-container"
).innerHTML =
    field.map;


/* =========================================================
   LANGUAGE
========================================================= */

let lang =
    localStorage.getItem(
        "airsoft_lang"
    ) || "cs";


document.getElementById(
    "lang-toggle"
).textContent =
    "🌐 " + lang.toUpperCase();


document.querySelectorAll(
    "[data-lang]"
).forEach(btn => {

    btn.addEventListener(
        "click",
        () => {

            lang =
                btn.dataset.lang;

            localStorage.setItem(
                "airsoft_lang",
                lang
            );

            document.getElementById(
                "lang-toggle"
            ).textContent =
                "🌐 " +
                lang.toUpperCase();

            document.getElementById(
                "back-btn"
            ).textContent =
                lang === "en"
                    ? "← Back to selection"
                    : "← Zpět na výběr";

        }
    );

});


/* =========================================================
   BACK
========================================================= */

document.getElementById(
    "back-btn"
).onclick = () => {

    window.location.href =
        "menu.html";

};


/* =========================================================
   DROPDOWNS
========================================================= */

document.querySelectorAll(
    ".dd-btn"
).forEach(btn => {

    btn.addEventListener(
        "click",
        e => {

            e.stopPropagation();

            const dd =
                btn.closest(".dd");

            document
                .querySelectorAll(".dd.open")
                .forEach(x =>
                    x.classList.remove("open")
                );

            dd.classList.add("open");

        }
    );

});


document.addEventListener(
    "click",
    () => {

        document
            .querySelectorAll(".dd.open")
            .forEach(x =>
                x.classList.remove("open")
            );

    }
);


/* =========================================================
   2D / 3D
========================================================= */

const svg =
    document.querySelector(
        "#map-container svg"
    );

document.getElementById(
    "view3d"
).onclick = () => {

    svg.style.transform =
        "perspective(1200px) rotateX(38deg) scale(1.08)";

    document.getElementById(
        "view3d"
    ).classList.add("active");

    document.getElementById(
        "view2d"
    ).classList.remove("active");

};


document.getElementById(
    "view2d"
).onclick = () => {

    svg.style.transform =
        "none";

    document.getElementById(
        "view2d"
    ).classList.add("active");

    document.getElementById(
        "view3d"
    ).classList.remove("active");

};


/* =========================================================
   GAME MODES
========================================================= */

const MODE_DATA = {

    overview:{

        title:"OVERVIEW",

        description:
            "Taktický přehled hřiště. Budovy, komunikace a hlavní body zájmu."

    },

    nightfall:{

        title:"NIGHTFALL",

        description:
            "Noční operace. Čtyři frakce, základny, omezené informace a postupné obsazování objektů."

    },

    sunrise:{

        title:"SUNRISE",

        description:
            "Denní fáze operace. Loot dropy, medici, juggernauti a aktivní přesuny mezi zónami."

    },

    dawn:{

        title:"DAWN",

        description:
            "Finální fáze. Zóna se zmenšuje a prostor pro přežití se postupně uzavírá."

    }

};


document
    .querySelectorAll(
        "[data-mode]"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        "[data-mode]"
                    )
                    .forEach(x =>
                        x.classList.remove(
                            "active"
                        )
                    );

                button.classList.add(
                    "active"
                );


                const data =
                    MODE_DATA[
                        button.dataset.mode
                    ];


                document.getElementById(
                    "mode-title"
                ).textContent =
                    data.title;


                document.getElementById(
                    "mode-description"
                ).textContent =
                    data.description;

            }
        );

    });


/* =========================================================
   STYLE PLACEHOLDER
========================================================= */

document
    .querySelectorAll(
        "[data-style]"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const style =
                    button.dataset.style;

                localStorage.setItem(
                    "airsoft_style",
                    style
                );

                /*
                   TADY POZDĚJI
                   napojíme skutečný
                   systém skinů celého webu.
                */

                if(style === "re"){

                    document.body.style.setProperty(
                        "--unused",
                        "1"
                    );

                }

            }
        );

    });

</script>
