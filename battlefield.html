<!DOCTYPE html>
<html lang="cs">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AIRSOFT MAPS — Battlefield</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --accent:#ff7a1a;
    --bg:#050608;
    --panel:#0b0e11;
    --border:#292e34;
    --text:#eef1f0;
    --muted:#7d858c;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:"Rajdhani",sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

/* =========================================================
   HEADER
========================================================= */

header{
    height:76px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 4vw;

    background:rgba(5,6,8,.96);
    border-bottom:1px solid var(--border);

    position:relative;
    z-index:50;
}

.back-btn,
.control-btn{
    height:38px;

    padding:0 14px;

    background:rgba(255,255,255,.025);
    border:1px solid var(--border);

    color:#c7ccd1;

    font-family:"Rajdhani",sans-serif;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;

    cursor:pointer;

    transition:.2s ease;
}

.back-btn:hover,
.control-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
}

.field-title{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}

.field-title small{
    display:block;

    color:var(--accent);

    font-size:9px;
    letter-spacing:.35em;
}

.field-title h1{
    font-family:"Anton",sans-serif;

    font-size:30px;
    line-height:1;

    letter-spacing:.05em;
}

.controls{
    display:flex;
    gap:8px;
}

.dropdown{
    position:relative;
}

.dropdown-menu{
    position:absolute;

    top:44px;
    right:0;

    min-width:170px;

    background:#090b0e;
    border:1px solid var(--border);

    display:none;

    box-shadow:0 20px 50px rgba(0,0,0,.7);
}

.dropdown.open .dropdown-menu{
    display:block;
}

.dropdown-menu button{
    width:100%;

    padding:11px 14px;

    border:0;

    background:none;

    color:#c7ccd1;

    text-align:left;

    font-family:"Rajdhani",sans-serif;

    cursor:pointer;
}

.dropdown-menu button:hover{
    background:rgba(255,122,26,.1);
    color:var(--accent);
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
    height:58px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:12px;

    background:#080a0c;

    border-bottom:1px solid var(--border);

    position:relative;
    z-index:40;
}

.switch{
    display:flex;

    border:1px solid var(--border);
}

.switch button{
    height:32px;

    min-width:70px;

    padding:0 14px;

    border:0;

    background:#0b0e11;

    color:#737b82;

    font-family:"Rajdhani",sans-serif;

    font-size:11px;
    font-weight:600;

    letter-spacing:.15em;

    cursor:pointer;
}

.switch button.active{
    background:var(--accent);
    color:#090b0c;
}

/* =========================================================
   MAP
========================================================= */

.map-wrap{
    position:relative;

    flex:1;

    margin:
        0
        3vw
        28px;

    border:1px solid var(--border);

    overflow:hidden;

    background:#111;

    box-shadow:
        0 20px 80px rgba(0,0,0,.7);
}

/*
    Google Maps base.

    Souřadnice:
    AIRSOFT PARK GRYGOV
    49.530874, 17.316725
*/

#google-map{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    border:0;

    filter:
        saturate(.65)
        brightness(.72)
        contrast(1.08);
}

/* =========================================================
   DARK MAP OVERLAY
========================================================= */

.map-darkness{
    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.35),
            transparent 25%,
            transparent 75%,
            rgba(0,0,0,.35)
        );

    z-index:5;
}

/* =========================================================
   TOP LEFT
========================================================= */

.map-header{
    position:absolute;

    left:18px;
    top:18px;

    z-index:20;

    padding:12px 15px;

    background:rgba(5,7,8,.9);

    border-left:2px solid var(--accent);

    backdrop-filter:blur(8px);
}

.map-header small{
    display:block;

    color:var(--accent);

    font-size:9px;
    letter-spacing:.25em;
}

.map-header strong{
    display:block;

    margin-top:2px;

    font-family:"Anton",sans-serif;

    font-size:24px;
}

/* =========================================================
   MAP DATA PANEL
========================================================= */

.info-panel{
    position:absolute;

    left:18px;
    bottom:18px;

    width:270px;

    padding:15px;

    background:rgba(5,7,8,.92);

    border:1px solid var(--border);

    z-index:20;

    backdrop-filter:blur(10px);
}

.info-title{
    color:var(--accent);

    font-size:9px;
    letter-spacing:.25em;

    margin-bottom:6px;
}

.info-name{
    font-family:"Anton",sans-serif;

    font-size:25px;
}

.info-text{
    margin-top:6px;

    color:var(--muted);

    font-size:11px;

    line-height:1.35;
}

/* =========================================================
   LEGEND
========================================================= */

.legend{
    position:absolute;

    right:18px;
    bottom:18px;

    z-index:20;

    min-width:190px;

    padding:12px 14px;

    background:rgba(5,7,8,.92);

    border:1px solid var(--border);
}

.legend-title{
    color:var(--accent);

    font-size:9px;
    letter-spacing:.25em;

    margin-bottom:8px;
}

.legend-row{
    display:flex;

    align-items:center;

    gap:8px;

    margin-top:6px;

    color:#aab1b5;

    font-size:10px;
}

.legend-line{
    width:22px;
    height:3px;

    background:var(--accent);
}

.legend-building{
    width:18px;
    height:12px;

    background:#666;

    border:1px solid #ddd;
}

/* =========================================================
   MAP OVERLAY MARKERS
========================================================= */

.marker-layer{
    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:10;
}

/*
    Tohle je záměrně zatím prázdné.

    Až budeme mít přesné tvoje linie
    a pozice budov, vložíme je sem.
*/

.playing-area{
    position:absolute;

    border:2px dashed var(--accent);

    background:rgba(255,122,26,.04);

    pointer-events:none;
}

/* =========================================================
   STATUS BAR
========================================================= */

.statusbar{
    position:fixed;

    bottom:0;
    left:0;
    right:0;

    height:28px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:0 4vw;

    background:rgba(4,5,6,.97);

    border-top:1px solid var(--border);

    color:#59616a;

    font-size:9px;

    letter-spacing:.15em;

    z-index:60;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    header{
        height:92px;

        padding:
            8px 3vw;

        align-items:flex-start;
    }

    .field-title{
        top:10px;
    }

    .field-title h1{
        font-size:23px;
    }

    .field-title small{
        display:none;
    }

    .back-btn{
        margin-top:42px;
    }

    .controls{
        margin-top:42px;
    }

    .toolbar{
        height:52px;

        gap:6px;
    }

    .switch button{
        min-width:58px;

        padding:0 8px;

        font-size:9px;
    }

    .map-wrap{
        margin:
            0
            2vw
            28px;
    }

    .info-panel{
        left:10px;
        bottom:10px;

        width:210px;
    }

    .legend{
        right:10px;
        bottom:10px;

        min-width:auto;
    }

}

</style>

</head>


<body>


<header>

    <button
        class="back-btn"
        id="backBtn">

        ← ZPĚT

    </button>


    <div class="field-title">

        <small>AIRSOFT MAP SYSTEM</small>

        <h1 id="fieldName">
            GRYGOV
        </h1>

    </div>


    <div class="controls">

        <div
            class="dropdown"
            id="languageDropdown">

            <button
                class="control-btn"
                id="languageButton">

                🌐 CZ

            </button>

            <div class="dropdown-menu">

                <button data-language="cs">
                    Čeština
                </button>

                <button data-language="en">
                    English
                </button>

            </div>

        </div>


        <div
            class="dropdown"
            id="styleDropdown">

            <button
                class="control-btn">

                🎨 STYL

            </button>

            <div class="dropdown-menu">

                <button data-style="dark">
                    Tmavý
                </button>

                <button data-style="light">
                    Světlý
                </button>

                <button data-style="resident-evil">
                    Resident Evil
                </button>

                <button data-style="pubg">
                    PUBG
                </button>

                <button data-style="fortnite">
                    Fortnite
                </button>

            </div>

        </div>

    </div>

</header>


<div class="toolbar">

    <div class="switch">

        <button
            class="active"
            data-layer="map">

            MAPA

        </button>

        <button
            data-layer="terrain">

            TERÉN

        </button>

        <button
            data-layer="buildings">

            BUDOVY

        </button>

        <button
            data-layer="zones">

            ZÓNY

        </button>

    </div>


    <div class="switch">

        <button
            class="active"
            id="view2d">

            2D

        </button>

        <button
            id="view3d">

            3D

        </button>

    </div>

</div>


<div class="map-wrap">


    <iframe
        id="google-map"
        title="AIRSOFT PARK GRYGOV"
        src="https://www.google.com/maps?q=49.530874,17.316725&z=17&t=k&output=embed"
        loading="lazy"
        allowfullscreen>
    </iframe>


    <div class="map-darkness"></div>


    <div class="marker-layer"
         id="markerLayer">

    </div>


    <div class="map-header">

        <small>
            BATTLEFIELD
        </small>

        <strong>
            AIRSOFT PARK GRYGOV
        </strong>

    </div>


    <div class="info-panel">

        <div class="info-title">
            FIELD INTELLIGENCE
        </div>

        <div class="info-name">
            GRYGOV
        </div>

        <div class="info-text">

            Reálný mapový podklad.
            Herní vrstvy budou umístěny
            přímo nad skutečný areál.

        </div>

    </div>


    <div class="legend">

        <div class="legend-title">
            MAP LEGEND
        </div>

        <div class="legend-row">

            <span class="legend-building"></span>

            BUDOVA

        </div>

        <div class="legend-row">

            <span class="legend-line"></span>

            HRANICE HŘIŠTĚ

        </div>

    </div>

</div>


<div class="statusbar">

    <span>
        SYSTEM ONLINE
    </span>

    <span>
        AIRSOFT MAPS // BATTLEFIELD
    </span>

</div>


<script>

/* =========================================================
   BACK
========================================================= */

document
    .getElementById("backBtn")
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "menu.html";

        }
    );


/* =========================================================
   DROPDOWNS
========================================================= */

document
    .querySelectorAll(".dropdown > .control-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                const parent =
                    button.closest(".dropdown");

                document
                    .querySelectorAll(".dropdown")
                    .forEach(dropdown => {

                        if(dropdown !== parent){

                            dropdown.classList.remove(
                                "open"
                            );

                        }

                    });

                parent.classList.toggle("open");

            }
        );

    });


document.addEventListener(
    "click",
    () => {

        document
            .querySelectorAll(".dropdown")
            .forEach(dropdown => {

                dropdown.classList.remove(
                    "open"
                );

            });

    }
);


/* =========================================================
   LANGUAGE
========================================================= */

let language =
    localStorage.getItem(
        "airsoft_lang"
    ) || "cs";


function updateLanguage(){

    document.getElementById(
        "languageButton"
    ).textContent =
        "🌐 " +
        language.toUpperCase();


    document.getElementById(
        "backBtn"
    ).textContent =
        language === "en"
            ? "← BACK"
            : "← ZPĚT";

}


document
    .querySelectorAll("[data-language]")
    .forEach(button => {

        button.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                language =
                    button.dataset.language;

                localStorage.setItem(
                    "airsoft_lang",
                    language
                );

                updateLanguage();

            }
        );

    });


updateLanguage();


/* =========================================================
   MAP LAYERS
========================================================= */

document
    .querySelectorAll("[data-layer]")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        "[data-layer]"
                    )
                    .forEach(item => {

                        item.classList.remove(
                            "active"
                        );

                    });

                button.classList.add(
                    "active"
                );

            }
        );

    });


/* =========================================================
   2D / 3D
========================================================= */

const map =
    document.getElementById(
        "google-map"
    );


document
    .getElementById("view3d")
    .addEventListener(
        "click",
        () => {

            map.style.transform =
                "perspective(1200px) rotateX(35deg) scale(1.08)";

            map.style.transformOrigin =
                "center center";

            document
                .getElementById("view3d")
                .classList.add("active");

            document
                .getElementById("view2d")
                .classList.remove("active");

        }
    );


document
    .getElementById("view2d")
    .addEventListener(
        "click",
        () => {

            map.style.transform =
                "none";

            document
                .getElementById("view2d")
                .classList.add("active");

            document
                .getElementById("view3d")
                .classList.remove("active");

        }
    );


/* =========================================================
   STYLE
========================================================= */

document
    .querySelectorAll("[data-style]")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const style =
                    button.dataset.style;

                localStorage.setItem(
                    "airsoft_style",
                    style
                );

            }
        );

    });

</script>

</body>

</html>
