<!DOCTYPE html>
<html lang="cs">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:title" content="Airsoft Maps — Akce">
<meta property="og:description" content="Airsoftové akce">
<meta property="og:image" content="https://airsoftmaps.github.io/loga/bilekulate.png">
<meta property="og:url" content="https://airsoftmaps.github.io/akce.html">
<meta property="og:type" content="website">

<title>AIRSOFT MAPS — AKCE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="common.css?v=3">

<meta name="theme-color" content="#ff7a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Airsoft Maps">
<link rel="apple-touch-icon" href="/loga/tmavekulate.png">


<style>

/* =========================================================
   AIRSOFT MAPS — CINEMATIC EVENTS SCREEN
   ========================================================= */

html,
body {
  margin: 0;
  min-height: 100%;
  overflow: hidden;
}


/* ---------------------------------------------------------
   MAIN SCREEN
   --------------------------------------------------------- */

.am-event-cinematic {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(255,122,26,.11),
      transparent 35%
    ),
    #08090b;

  isolation: isolate;
}


/* ---------------------------------------------------------
   GRID
   --------------------------------------------------------- */

.am-event-cinematic::before {
  content: "";

  position: absolute;
  inset: -50%;

  background-image:
    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 1px,
      transparent 1px
    );

  background-size: 45px 45px;

  transform:
    perspective(600px)
    rotateX(62deg)
    translateY(18%);

  opacity: .55;

  animation: gridMove 14s linear infinite;

  pointer-events: none;
}


@keyframes gridMove {

  from {
    transform:
      perspective(600px)
      rotateX(62deg)
      translateY(18%);
  }

  to {
    transform:
      perspective(600px)
      rotateX(62deg)
      translateY(2%);
  }

}


/* ---------------------------------------------------------
   SCANLINES
   --------------------------------------------------------- */

.am-event-cinematic::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(255,255,255,.018) 4px
    );

  pointer-events: none;

  z-index: 10;
}


/* ---------------------------------------------------------
   ORANGE LIGHT
   --------------------------------------------------------- */

.event-light {
  position: absolute;

  width: 55vw;
  height: 55vw;

  max-width: 700px;
  max-height: 700px;

  border-radius: 50%;

  background: rgba(255,122,26,.06);

  filter: blur(80px);

  animation: pulseLight 4s ease-in-out infinite;

  pointer-events: none;
}


@keyframes pulseLight {

  0%,
  100% {
    opacity: .45;
    transform: scale(.92);
  }

  50% {
    opacity: .8;
    transform: scale(1.08);
  }

}


/* ---------------------------------------------------------
   CONTENT
   --------------------------------------------------------- */

.event-content {

  position: relative;

  width: min(850px, 90vw);

  text-align: center;

  z-index: 5;
}


/* ---------------------------------------------------------
   LOGO
   --------------------------------------------------------- */

.event-logo {

  width: 82px;
  height: 82px;

  object-fit: contain;

  margin-bottom: 28px;

  opacity: 0;

  filter:
    drop-shadow(
      0 0 25px rgba(255,122,26,.35)
    );

  animation:
    logoIn 1.4s cubic-bezier(.2,.8,.2,1) .25s forwards;

}


@keyframes logoIn {

  0% {
    opacity: 0;
    transform: scale(.65) rotate(-8deg);
  }

  100% {
    opacity: 1;
    transform: scale(1) rotate(0);
  }

}


/* ---------------------------------------------------------
   TOP LABEL
   --------------------------------------------------------- */

.event-kicker {

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 14px;

  margin-bottom: 15px;

  color: var(--am-accent, #ff7a1a);

  font-family: Rajdhani, sans-serif;

  font-size: 11px;
  font-weight: 700;

  letter-spacing: .32em;

  opacity: 0;

  animation:
    fadeUp .9s ease .8s forwards;

}


.event-kicker-line {

  width: 45px;
  height: 1px;

  background: currentColor;

  opacity: .65;

}


/* ---------------------------------------------------------
   TITLE
   --------------------------------------------------------- */

.event-title {

  margin: 0;

  font-family: Anton, sans-serif;

  font-size: clamp(
    64px,
    14vw,
    150px
  );

  line-height: .82;

  letter-spacing: .025em;

  color: #f1f1f1;

  text-shadow:
    0 0 40px rgba(255,122,26,.08);

  opacity: 0;

  animation:
    cinematicTitle 1.5s
    cubic-bezier(.16,1,.3,1)
    .65s
    forwards;

}


@keyframes cinematicTitle {

  0% {
    opacity: 0;
    transform:
      scale(1.12)
      translateY(35px);

    filter: blur(12px);
  }

  100% {
    opacity: 1;
    transform:
      scale(1)
      translateY(0);

    filter: blur(0);
  }

}


/* ---------------------------------------------------------
   SUBTITLE
   --------------------------------------------------------- */

.event-subtitle {

  margin: 20px auto 0;

  max-width: 600px;

  color: #858d96;

  font-family: Rajdhani, sans-serif;

  font-size: 15px;

  letter-spacing: .08em;

  opacity: 0;

  animation:
    fadeUp .9s ease 1.35s forwards;

}


/* ---------------------------------------------------------
   LOADING
   --------------------------------------------------------- */

.event-loading {

  width: min(460px, 80vw);

  margin: 38px auto 0;

  opacity: 0;

  animation:
    fadeUp .8s ease 1.7s forwards;

}


.event-loading-top {

  display: flex;

  justify-content: space-between;

  margin-bottom: 8px;

  color: #646c74;

  font-family: Rajdhani, sans-serif;

  font-size: 10px;

  font-weight: 700;

  letter-spacing: .16em;

}


#loading-percent {
  color: var(--am-accent, #ff7a1a);
}


.loading-bar {

  position: relative;

  width: 100%;
  height: 2px;

  overflow: hidden;

  background: rgba(255,255,255,.08);

}


.loading-progress {

  position: absolute;

  left: 0;
  top: 0;

  width: 0%;
  height: 100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--am-accent, #ff7a1a)
    );

  box-shadow:
    0 0 14px
    var(--am-accent, #ff7a1a);

  transition:
    width .08s linear;

}


/* ---------------------------------------------------------
   ENTER BUTTON
   --------------------------------------------------------- */

.event-enter {

  display: inline-flex;

  align-items: center;
  justify-content: center;

  min-width: 250px;

  margin-top: 34px;

  padding: 15px 28px;

  border: 1px solid
    var(--am-accent, #ff7a1a);

  background:
    rgba(255,122,26,.035);

  color: #f1f1f1;

  font-family: Rajdhani, sans-serif;

  font-size: 13px;

  font-weight: 700;

  letter-spacing: .22em;

  cursor: pointer;

  opacity: 0;

  transform:
    translateY(15px);

  pointer-events: none;

  transition:
    background .2s ease,
    box-shadow .2s ease,
    transform .2s ease;

}


.event-enter.visible {

  opacity: 1;

  transform:
    translateY(0);

  pointer-events: auto;

}


.event-enter:hover {

  background:
    var(--am-accent, #ff7a1a);

  color: #08090b;

  box-shadow:
    0 0 30px
    rgba(255,122,26,.25);

}


.event-enter span:last-child {
  margin-left: 13px;
  font-size: 18px;
}


/* ---------------------------------------------------------
   BOTTOM STATUS
   --------------------------------------------------------- */

.event-status {

  position: absolute;

  left: 50%;
  bottom: 24px;

  transform: translateX(-50%);

  width: calc(100% - 40px);

  display: flex;

  justify-content: center;

  color: #4e555c;

  font-family: Rajdhani, sans-serif;

  font-size: 9px;

  letter-spacing: .2em;

  opacity: 0;

  animation:
    fadeUp .8s ease 2s forwards;

}


.event-status::before {

  content: "";

  width: 5px;
  height: 5px;

  margin:
    3px 9px 0 0;

  border-radius: 50%;

  background:
    var(--am-accent, #ff7a1a);

  box-shadow:
    0 0 8px
    var(--am-accent, #ff7a1a);

}


/* ---------------------------------------------------------
   FADE
   --------------------------------------------------------- */

.event-fade {

  position: fixed;
  inset: 0;

  z-index: 50;

  background: #050607;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .65s ease;

}


.event-fade.active {

  opacity: 1;

}


/* ---------------------------------------------------------
   ANIMATIONS
   --------------------------------------------------------- */

@keyframes fadeUp {

  from {
    opacity: 0;
    transform:
      translateY(18px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }

}


/* ---------------------------------------------------------
   MOBILE
   --------------------------------------------------------- */

@media (max-width: 600px) {

  .event-logo {
    width: 68px;
    height: 68px;
  }

  .event-title {
    font-size: 22vw;
  }

  .event-subtitle {
    font-size: 13px;
  }

  .event-loading {
    margin-top: 30px;
  }

  .event-enter {
    width: min(250px, 80vw);
  }

}

</style>

</head>


<body>


<div class="am-event-cinematic">

  <div class="event-light"></div>


  <div class="event-content">

    <img
      class="event-logo"
      src="loga/tmavekulate.png"
      alt="Airsoft Maps"
    >


    <div class="event-kicker">

      <span class="event-kicker-line"></span>

      <span id="event-kicker">
        AIRSOFT MAPS SYSTEM
      </span>

      <span class="event-kicker-line"></span>

    </div>


    <h1
      class="event-title"
      id="event-title"
    >
      AKCE
    </h1>


    <p
      class="event-subtitle"
      id="event-subtitle"
    >
      Připravujeme přístup k databázi airsoftových akcí.
    </p>


    <div class="event-loading">

      <div class="event-loading-top">

        <span id="loading-status">
          INITIALIZING EVENT DATABASE
        </span>

        <span>
          <span id="loading-percent">0</span>%
        </span>

      </div>


      <div class="loading-bar">

        <div
          class="loading-progress"
          id="loading-progress"
        ></div>

      </div>

    </div>


    <button
      class="event-enter"
      id="event-enter"
      type="button"
    >

      <span id="enter-text">
        VSTOUPIT DO AKCÍ
      </span>

      <span>→</span>

    </button>

  </div>


  <div
    class="event-status"
    id="event-status"
  >
    SYSTEM READY
  </div>

</div>


<div
  class="event-fade"
  id="event-fade"
></div>



<script src="common.js?v=3"></script>


<script>

/* =========================================================
   AIRSOFT MAPS — CINEMATIC EVENTS
   ========================================================= */


/*
   SEM DEJ ODKAZ NA STRÁNKU S AKCEMI.

   Příklad:

   https://nejaka-stranka.cz/akce

   nebo:

   https://example.com
*/

const EVENTS_URL =
  "https://example.com";


/* ---------------------------------------------------------
   TEXTY
   --------------------------------------------------------- */

const TEXT = {

  cs: {

    kicker:
      "AIRSOFT MAPS SYSTEM",

    title:
      "AKCE",

    subtitle:
      "Připravujeme přístup k databázi airsoftových akcí.",

    loading:
      "NAČÍTÁM DATABÁZI AKCÍ",

    ready:
      "DATABÁZE PŘIPRAVENA",

    enter:
      "VSTOUPIT DO AKCÍ",

    status:
      "SYSTEM READY"

  },


  en: {

    kicker:
      "AIRSOFT MAPS SYSTEM",

    title:
      "EVENTS",

    subtitle:
      "Preparing access to the airsoft event database.",

    loading:
      "LOADING EVENT DATABASE",

    ready:
      "DATABASE READY",

    enter:
      "ENTER EVENTS",

    status:
      "SYSTEM READY"

  }

};


/* ---------------------------------------------------------
   TÉMA
   --------------------------------------------------------- */

/*
   common.js používá localStorage pro téma.

   Pokusíme se najít uloženou hodnotu
   několika běžnými názvy, aby stránka
   fungovala i při změnách v systému.
*/

function getSavedTheme() {

  const keys = [
    "am-theme",
    "theme",
    "airsoftmaps-theme"
  ];

  for (const key of keys) {

    const value =
      localStorage.getItem(key);

    if (value)
      return value;

  }

  return "dark";

}


const savedTheme =
  getSavedTheme();


/*
   Přidáme stejné téma na BODY.

   common.css potom může automaticky
   obarvit stránku stejně jako menu.
*/

document.body.dataset.theme =
  savedTheme;

document.documentElement.dataset.theme =
  savedTheme;


/* ---------------------------------------------------------
   LANGUAGE
   --------------------------------------------------------- */

let lang = "cs";

try {

  if (
    typeof AM !== "undefined" &&
    typeof AM.getLang === "function"
  ) {

    lang = AM.getLang();

  }

} catch (e) {}



const t =
  TEXT[lang] || TEXT.cs;


document.getElementById(
  "event-kicker"
).textContent =
  t.kicker;


document.getElementById(
  "event-title"
).textContent =
  t.title;


document.getElementById(
  "event-subtitle"
).textContent =
  t.subtitle;


document.getElementById(
  "loading-status"
).textContent =
  t.loading;


document.getElementById(
  "enter-text"
).textContent =
  t.enter;


document.getElementById(
  "event-status"
).textContent =
  t.status;


/* ---------------------------------------------------------
   CINEMATIC LOADING
   --------------------------------------------------------- */

const progress =
  document.getElementById(
    "loading-progress"
  );

const percent =
  document.getElementById(
    "loading-percent"
  );

const loadingStatus =
  document.getElementById(
    "loading-status"
  );

const enter =
  document.getElementById(
    "event-enter"
  );


let current = 0;


/*
   Malé nepravidelnosti působí
   méně jako obyčejný progress bar
   a víc jako skutečný systém.
*/

const loadingTimer =
  setInterval(() => {

    let step;

    if (current < 55) {

      step =
        Math.random() * 3 + 1;

    } else if (current < 85) {

      step =
        Math.random() * 1.8 + .4;

    } else {

      step =
        Math.random() * .7 + .15;

    }


    current += step;


    if (current >= 100) {

      current = 100;

      clearInterval(
        loadingTimer
      );


      progress.style.width =
        "100%";


      percent.textContent =
        "100";


      loadingStatus.textContent =
        t.ready;


      enter.classList.add(
        "visible"
      );

      return;

    }


    progress.style.width =
      current + "%";


    percent.textContent =
      Math.floor(current);

  }, 55);


/* ---------------------------------------------------------
   ENTER
   --------------------------------------------------------- */

enter.addEventListener(
  "click",
  () => {

    if (
      !EVENTS_URL ||
      EVENTS_URL ===
      "https://example.com"
    ) {

      alert(
        lang === "en"
          ? "Set EVENTS_URL in akce.html first."
          : "Nejdříve nastav EVENTS_URL v akce.html."
      );

      return;

    }


    const fade =
      document.getElementById(
        "event-fade"
      );


    fade.classList.add(
      "active"
    );


    /*
       Krátký cinematic fade.
       Potom otevře NOVÉ OKNO / PANEL.
    */

    setTimeout(
      () => {

        window.open(
          EVENTS_URL,
          "_blank"
        );


        fade.classList.remove(
          "active"
        );

      },
      650
    );

  }
);


/* ---------------------------------------------------------
   ESCAPE
   --------------------------------------------------------- */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      window.history.back();

    }

  }
);

</script>

</body>
</html>
