<!DOCTYPE html>
<html lang="cs">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:title" content="Airsoft Maps — Akce">
<meta property="og:description" content="Airsoftové akce">
<meta property="og:image" content="https://airsoftmaps.github.io/loga/bilekulate.png">
<meta property="og:url" content="https://airsoftmaps.github.io/akce.html">
<meta property="og:type" content="website">

<title>AIRSOFT MAPS — AKCE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="common.css?v=3">

<meta name="theme-color" content="#ff7a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Airsoft Maps">
<link rel="apple-touch-icon" href="/loga/tmavekulate.png">


<style>

/* =========================================================
   AIRSOFT MAPS — CINEMATIC EVENTS SCREEN
   Používá stejné proměnné jako zbytek webu (common.css),
   takže se celá scéna přebarví podle zvoleného stylu
   (Tmavý / Světlý / Resident Evil / PUBG / Fortnite).
   ========================================================= */

/*
   "Inkoust" mřížky/scanlinek — na tmavých motivech bílá
   s nízkou průhledností, na světlém motivu potřebuje být
   tmavý, jinak by na bílém pozadí nebyl vůbec vidět.
*/
:root {
  --cine-ink: rgba(255,255,255,.05);
  --cine-ink-strong: rgba(255,255,255,.09);
}

html[data-theme="light"] {
  --cine-ink: rgba(0,0,0,.06);
  --cine-ink-strong: rgba(0,0,0,.1);
}


/* ---------------------------------------------------------
   HERO / STAGE
   Vyplňuje prostor mezi hlavičkou a patičkou (stejný flex
   layout jako .am-map-body na ostatních stránkách).
   --------------------------------------------------------- */

.am-event-stage {
  position: relative;
  z-index: 5;

  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  min-height: 60vh;

  overflow: hidden;

  isolation: isolate;
}


/* GRID */

.am-event-stage::before {
  content: "";

  position: absolute;
  inset: -50%;

  background-image:
    linear-gradient(var(--cine-ink) 1px, transparent 1px),
    linear-gradient(90deg, var(--cine-ink) 1px, transparent 1px);

  background-size: 45px 45px;

  transform:
    perspective(600px)
    rotateX(62deg)
    translateY(18%);

  opacity: .8;

  animation: gridMove 14s linear infinite;

  pointer-events: none;
}

@keyframes gridMove {
  from { transform: perspective(600px) rotateX(62deg) translateY(18%); }
  to   { transform: perspective(600px) rotateX(62deg) translateY(2%); }
}


/* SCANLINES */

.am-event-stage::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      var(--cine-ink-strong) 4px
    );

  pointer-events: none;

  z-index: 10;
}


/* GLOW (barva podle motivu přes --accent) */

.event-light {
  position: absolute;

  width: 55vw;
  height: 55vw;

  max-width: 700px;
  max-height: 700px;

  border-radius: 50%;

  background: var(--theme-glow-strong);

  filter: blur(80px);

  animation: pulseLight 4s ease-in-out infinite;

  pointer-events: none;
}

@keyframes pulseLight {
  0%, 100% { opacity: .55; transform: scale(.92); }
  50%      { opacity: 1;   transform: scale(1.08); }
}

/* ---------------------------------------------------------
   EVENT WALLPAPER
   --------------------------------------------------------- */

.event-wallpaper {
  position: absolute;
  inset: 0;

  z-index: 1;

  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;

  opacity: 0;
  pointer-events: none;

  transition: opacity .8s ease;
}

.event-wallpaper.visible {
  opacity: 1;
}

/* Dark + Light = bez wallpaperu */

html[data-theme="dark"] .event-wallpaper,
html[data-theme="light"] .event-wallpaper {
  display: none;
}

/* Tematické wallpapery */

html[data-theme="resident-evil"] .event-wallpaper {
  background-image: url("REWAL.jpg");
}

html[data-theme="pubg"] .event-wallpaper {
  background-image: url("PUBGWAL.jpg");
}

html[data-theme="fortnite"] .event-wallpaper {
  background-image: url("FORWAL.jpg");
}

/* Jemný overlay pro lepší čitelnost tlačítka */

.event-wallpaper::after {
  content: "";
  position: absolute;
  inset: 0;

  background: rgba(0,0,0,.18);
}
/* ---------------------------------------------------------
   CONTENT
   --------------------------------------------------------- */

.event-content {
     transition: opacity .7s ease, transform .7s ease;
  position: relative;
  width: min(850px, 90vw);
  text-align: center;
  z-index: 5;
}
.event-content.loaded {
  opacity: 0;
  transform: scale(.96);
  pointer-events: none;
}
   .event-status.loaded {
  opacity: 0;
  pointer-events: none;
}
.event-logo {
  width: 82px;
  height: 82px;

  object-fit: contain;

  margin: 0 auto 28px;

  opacity: 0;

  filter: drop-shadow(0 0 25px var(--theme-glow-strong));

  animation: logoIn 1.4s cubic-bezier(.2,.8,.2,1) .25s forwards;
}

@keyframes logoIn {
  0%   { opacity: 0; transform: scale(.65) rotate(-8deg); }
  100% { opacity: 1; transform: scale(1) rotate(0); }
}

.event-kicker {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;

  margin-bottom: 15px;

  color: var(--accent);

  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .32em;

  opacity: 0;

  animation: fadeUp .9s ease .8s forwards;
}

.event-kicker-line {
  width: 45px;
  height: 1px;
  background: currentColor;
  opacity: .65;
}

.event-title {
  margin: 0;

  font-family: var(--font-display);
  font-size: clamp(64px, 14vw, 150px);
  line-height: .82;
  letter-spacing: .025em;

  color: var(--text);

  text-shadow: 0 0 40px var(--theme-glow);

  opacity: 0;

  animation: cinematicTitle 1.5s cubic-bezier(.16,1,.3,1) .65s forwards;
}

@keyframes cinematicTitle {
  0%   { opacity: 0; transform: scale(1.12) translateY(35px); filter: blur(12px); }
  100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
}

.event-subtitle {
  margin: 20px auto 0;
  max-width: 600px;

  color: var(--muted);

  font-family: var(--font-body);
  font-size: 15px;
  letter-spacing: .08em;

  opacity: 0;

  animation: fadeUp .9s ease 1.35s forwards;
}

.event-loading {
  width: min(460px, 80vw);
  margin: 38px auto 0;

  opacity: 0;

  animation: fadeUp .8s ease 1.7s forwards;
}

.event-loading-top {
  display: flex;
  justify-content: space-between;

  margin-bottom: 8px;

  color: var(--muted-2);

  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .16em;
}

#loading-percent { color: var(--accent); }

.loading-bar {
  position: relative;
  width: 100%;
  height: 2px;
  overflow: hidden;
  background: var(--panel-2);
}

.loading-progress {
  position: absolute;
  left: 0;
  top: 0;
  width: 0%;
  height: 100%;

  background: linear-gradient(90deg, transparent, var(--accent));

  box-shadow: 0 0 14px var(--accent);

  transition: width .08s linear;
}

.event-enter {
  position: absolute;
  left: 50%;
  bottom: 12%;

  z-index: 20;
  display: inline-flex;
  align-items: center;
  justify-content: center;


  min-width: 250px;


  padding: 15px 28px;

  border: 1px solid var(--accent);

  background: var(--accent-dim);

  color: var(--text);

  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .22em;

  cursor: pointer;

  opacity: 0;

 transform: translate(-50%, 15px);

  pointer-events: none;

  transition:
    background .2s ease,
    box-shadow .2s ease,
    transform .2s ease;
}

.event-enter.visible {
  opacity: 1;
  transform: translate(-50%, 0);
  pointer-events: auto;
}
.event-disclaimer {
  position: absolute;
  left: 50%;
  bottom: calc(12% - 28px);

  transform: translateX(-50%);

  z-index: 20;

  color: var(--muted-2);
  font-family: var(--font-body);
  font-size: 9px;
  letter-spacing: .04em;
  white-space: nowrap;

  opacity: 0;
  transition: opacity .7s ease;
}

.event-disclaimer.visible {
  opacity: .75;
}
.event-enter:hover {
  background: var(--accent);
  color: var(--bg-0);
  box-shadow: 0 0 30px var(--theme-glow-strong);
}

.event-enter span:last-child {
  margin-left: 13px;
  font-size: 18px;
}

.event-status {
  position: relative;
  z-index: 5;

  display: flex;
  justify-content: center;

  padding-bottom: 18px;

  color: var(--muted-2);

  font-family: var(--font-body);
  font-size: 9px;
  letter-spacing: .2em;

  opacity: 0;

  animation: fadeUp .8s ease 2s forwards;
}

.event-status::before {
  content: "";

  width: 5px;
  height: 5px;

  margin: 3px 9px 0 0;

  border-radius: 50%;

  background: var(--accent);

  box-shadow: 0 0 8px var(--accent);
}

.event-fade {
  position: fixed;
  inset: 0;
  z-index: 50;

  background: var(--bg-0);

  opacity: 0;
  pointer-events: none;

  transition: opacity .65s ease;
}

.event-fade.active { opacity: 1; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}


/* ---------------------------------------------------------
   MOTIVOVÉ AKCENTY
   Drobné odlišení atmosféry podle zvoleného stylu.
   --------------------------------------------------------- */

html[data-theme="resident-evil"] .event-title {
  animation:
    cinematicTitle 1.5s cubic-bezier(.16,1,.3,1) .65s forwards,
    reFlicker 6s ease-in-out 2.2s infinite;
}
@keyframes reFlicker {
  0%, 96%, 100% { opacity: 1; }
  97% { opacity: .55; }
  98% { opacity: 1; }
  99% { opacity: .7; }
}

html[data-theme="fortnite"] .event-light {
  animation: pulseLight 2.4s ease-in-out infinite;
}

html[data-theme="pubg"] .am-event-stage::before {
  opacity: .55;
}

html[data-theme="light"] .event-logo {
  filter: drop-shadow(0 0 18px var(--theme-glow-strong));
}


/* ---------------------------------------------------------
   MOBILE
   --------------------------------------------------------- */

@media (max-width: 760px) {
  .event-logo { width: 68px; height: 68px; }
  .event-title { font-size: 22vw; }
  .event-subtitle { font-size: 13px; }
  .event-loading { margin-top: 30px; }
  .event-enter { width: min(250px, 80vw); }
}
/* PUBG — tlačítko uprostřed wallpaperu */

html[data-theme="pubg"] .event-enter {
  bottom: 42%;
}

html[data-theme="pubg"] .event-disclaimer {
  bottom: calc(42% - 28px);
}
   /* =========================================================
   DARK — COMMAND CENTER
   ========================================================= */

html[data-theme="dark"] .am-event-stage {
  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(255, 80, 20, .12),
      transparent 45%
    );
}

html[data-theme="dark"] .am-event-stage::before {
  opacity: .65;
  background-size: 38px 38px;
}

html[data-theme="dark"] .event-light {
  width: 65vw;
  height: 65vw;
  max-width: 850px;
  max-height: 850px;

  background:
    radial-gradient(
      circle,
      rgba(255, 90, 20, .22),
      transparent 65%
    );

  filter: blur(90px);
}

html[data-theme="dark"] .event-title {
  text-shadow:
    0 0 25px var(--theme-glow),
    0 0 80px rgba(255, 70, 20, .18);
}

html[data-theme="dark"] .event-loading {
  width: min(520px, 80vw);
}

html[data-theme="dark"] .loading-bar {
  height: 3px;
}


/* =========================================================
   LIGHT — TECHNICAL FIELD
   ========================================================= */

html[data-theme="light"] .am-event-stage {
  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(255, 120, 40, .12),
      transparent 42%
    ),
    linear-gradient(
      135deg,
      rgba(0,0,0,.025),
      transparent 45%,
      rgba(0,0,0,.04)
    );
}

html[data-theme="light"] .am-event-stage::before {
  opacity: .35;
  background-size: 50px 50px;
}

html[data-theme="light"] .event-light {
  width: 60vw;
  height: 60vw;
  max-width: 750px;
  max-height: 750px;

  background:
    radial-gradient(
      circle,
      rgba(255, 130, 50, .16),
      transparent 65%
    );

  filter: blur(100px);
}

html[data-theme="light"] .event-title {
  text-shadow:
    0 2px 20px rgba(0,0,0,.12);
}

html[data-theme="light"] .loading-bar {
  height: 3px;
}
   



/* =========================================================
   EVENT WALLPAPER — DEVICE SPECIFIC POSITIONING
   ========================================================= */

/* MOBIL */
@media (max-width: 760px) {

  /* Resident Evil — odkrýt spodní část */
  html[data-theme="resident-evil"] .event-wallpaper {
    background-position: center 80%;
  }

  /* Fortnite — odkrýt horní část */
  html[data-theme="fortnite"] .event-wallpaper {
    background-position: center 20%;
  }
}


/* PC */
@media (min-width: 761px) {

  /* PUBG — výrazně odkrýt spodní část */
  html[data-theme="pubg"] .event-wallpaper {
    background-position: center 75%;
  }
}
</style>

</head>


<body>

<header class="am-header">
  <a class="am-brand" href="menu.html">
    <img class="am-brand-logo" src="loga/tmavekulate.png" alt="Airsoft Maps">
  </a>

  <div class="am-field-title">AIRSOFT MAPS — <span id="event-kicker-header">AKCE</span></div>

  <div class="am-controls">
    <button class="am-btn" id="back-btn">← <span id="back-label">Zpět na hřiště</span></button>
    <div class="am-dd" id="lang-dd">
      <button class="am-btn">🌐 <span id="lang-current">CZ</span></button>
      <div class="am-dd-menu">
        <button data-lang="cs">Čeština</button>
        <button data-lang="en">English</button>
      </div>
    </div>
    <div class="am-dd" id="style-dd">
      <button class="am-btn">🎨 <span data-i18n="style">Styl</span></button>
      <div class="am-dd-menu">
        <button data-theme="dark">Tmavý</button>
        <button data-theme="light">Světlý</button>
        <button data-theme="resident-evil">Resident Evil</button>
        <button data-theme="pubg">PUBG</button>
        <button data-theme="fortnite">Fortnite</button>
      </div>
    </div>
  </div>
</header>

<main class="am-event-stage">

  <div class="event-light"></div>

  <div class="event-wallpaper" id="event-wallpaper"></div>

  <div class="event-content">


    <div class="event-kicker">
      <span class="event-kicker-line"></span>
      <span id="event-kicker">AIRSOFT MAPS SYSTEM</span>
      <span class="event-kicker-line"></span>
    </div>

    <h1 class="event-title" id="event-title">AKCE</h1>

    <p class="event-subtitle" id="event-subtitle">
      Připravujeme přístup k databázi airsoftových akcí.
    </p>

    <div class="event-loading">
      <div class="event-loading-top">
        <span id="loading-status">INITIALIZING EVENT DATABASE</span>
        <span><span id="loading-percent">0</span>%</span>
      </div>
      <div class="loading-bar">
        <div class="loading-progress" id="loading-progress"></div>
      </div>
    </div>

  </div>

  <button class="event-enter" id="event-enter" type="button">
  <span id="enter-text">VSTOUPIT DO AKCÍ</span>
  <span>→</span>
</button>

<div class="event-disclaimer" id="event-disclaimer">
  Tlačítko tě přesměruje na web mapa-airsoft-akci.cz
</div>

</main>

<div class="event-status" id="event-status">SYSTEM READY</div>

<div class="event-fade" id="event-fade"></div>


<script src="common.js?v=3"></script>

<script>

/* =========================================================
   AIRSOFT MAPS — CINEMATIC EVENTS
   ========================================================= */

/*
   SEM DEJ ODKAZ NA STRÁNKU S AKCEMI.
*/
const EVENTS_URL = "https://mapa-airsoft-akci.cz/";


/* ---------------------------------------------------------
   TEXTY
   --------------------------------------------------------- */

const TEXT = {
  cs: {
    back: "Zpět na hřiště",
    headerTitle: "AKCE",
    kicker: "AIRSOFT MAPS SYSTEM",
    title: "AKCE",
    subtitle: "Připravujeme přístup k databázi airsoftových akcí.",
    loading: "NAČÍTÁM DATABÁZI AKCÍ",
    ready: "DATABÁZE PŘIPRAVENA",
    enter: "VSTOUPIT DO AKCÍ",
    status: "SYSTEM READY"
  },
  en: {
    back: "Back to fields",
    headerTitle: "EVENTS",
    kicker: "AIRSOFT MAPS SYSTEM",
    title: "EVENTS",
    subtitle: "Preparing access to the airsoft event database.",
    loading: "LOADING EVENT DATABASE",
    ready: "DATABASE READY",
    enter: "ENTER EVENTS",
    status: "SYSTEM READY"
  }
};

let t = TEXT.cs;

function applyStaticText(lang) {
  t = TEXT[lang] || TEXT.cs;

  document.getElementById("back-label").textContent = t.back;
  document.getElementById("event-kicker-header").textContent = t.headerTitle;
  document.getElementById("event-kicker").textContent = t.kicker;
  document.getElementById("event-title").textContent = t.title;
  document.getElementById("event-subtitle").textContent = t.subtitle;
  document.getElementById("enter-text").textContent = t.enter;
  document.getElementById("event-status").textContent = t.status;

  // Načítací stav přepiš, jen pokud loading ještě neskončil
  const loadingStatusEl = document.getElementById("loading-status");
  if (!loadingStatusEl.dataset.done) {
    loadingStatusEl.textContent = t.loading;
  } else {
    loadingStatusEl.textContent = t.ready;
  }
}

AM.wireDropdowns();
AM.wireStyleSwitch();

applyStaticText(AM.getLang());

document.getElementById("back-btn").addEventListener("click", () => {
  window.location.href = "menu.html";
});

AM.wireLangSwitch((lang) => {
  applyStaticText(lang);
});


/* ---------------------------------------------------------
   CINEMATIC LOADING
   --------------------------------------------------------- */

const progress = document.getElementById("loading-progress");
const percent = document.getElementById("loading-percent");
const loadingStatus = document.getElementById("loading-status");
const wallpaper = document.getElementById("event-wallpaper");
const enter = document.getElementById("event-enter");
const disclaimer = document.getElementById("event-disclaimer");
   
let current = 0;

const loadingTimer = setInterval(() => {

  let step;

  if (current < 55) {
    step = Math.random() * 3 + 1;
  } else if (current < 85) {
    step = Math.random() * 1.8 + .4;
  } else {
    step = Math.random() * .7 + .15;
  }

  current += step;

  if (current >= 100) {
    current = 100;

    clearInterval(loadingTimer);

    progress.style.width = "100%";
    percent.textContent = "100";

loadingStatus.dataset.done = "true";
loadingStatus.textContent = t.ready;

setTimeout(() => {
document.querySelector(".event-content").classList.add("loaded");
document.getElementById("event-status").classList.add("loaded");
wallpaper.classList.add("visible");
enter.classList.add("visible");
disclaimer.classList.add("visible");
}, 500);

return;
  }

  progress.style.width = current + "%";
  percent.textContent = Math.floor(current);

}, 55);


/* ---------------------------------------------------------
   ENTER
   --------------------------------------------------------- */

enter.addEventListener("click", () => {

  if (!EVENTS_URL || EVENTS_URL === "https://example.com") {
    alert(
      AM.getLang() === "en"
        ? "Set EVENTS_URL in akce.html first."
        : "Nejdříve nastav EVENTS_URL v akce.html."
    );
    return;
  }

  const fade = document.getElementById("event-fade");
  fade.classList.add("active");

  setTimeout(() => {
    window.open(EVENTS_URL, "_blank");
    fade.classList.remove("active");
  }, 650);

});


/* ---------------------------------------------------------
   ESCAPE
   --------------------------------------------------------- */

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    window.history.back();
  }
});

</script>

</body>
</html>
